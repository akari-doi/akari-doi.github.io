u003ccode>-1\u003c/code> は最後の線）\u003c/li>\n\u003c/ul>\n\u003cp>スマホでは \u003ccode>display: grid\u003c/code> を指定していないので、ふつうに縦に並びます。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>Flexbox だと、この「2つ横並び＋下に1つ」を作るにはHTMLに \u003ccode>div\u003c/code> を足す必要があります。Grid ならHTMLを変えずに実現できます。\u003c/p>\u003c/div>","lecture":"grid-placement","links":[["MDN: ライン配置を使用したグリッドレイアウト","https://developer.mozilla.org/ja/docs/Web/CSS/CSS_grid_layout/Grid_layout_using_line-based_placement"],["MDN: grid-column","https://developer.mozilla.org/ja/docs/Web/CSS/grid-column"],["Qiita: CSS Grid Layout を極める！（基礎編）","https://qiita.com/kura07/items/e633b35e33e43240d363"]],"spots":[{"file":"css","start":503,"end":515,"note":"親：2列のグリッドを定義","ref":false},{"file":"css","start":525,"end":529,"note":"日付：1行目・1列目","ref":false},{"file":"css","start":538,"end":543,"note":"タイトル：1行目・2列目","ref":false},{"file":"css","start":549,"end":556,"note":"本文：2行目・全列","ref":false},{"file":"html","start":128,"end":132,"note":"HTMLの順番はそのまま","ref":false}]},{"id":"hover-underline","cat":"CSS","title":"ホバーで左から伸びる下線","body":"\u003cp>フッターのメニューにマウスを乗せると、下線が左から右へスーッと伸びます。\u003c/p>\n\u003cdiv class=\"demo\">\n\u003cp class=\"demo-cap\">▼ マウスを乗せてみましょう\u003c/p>\n\u003ca href=\"#hover-underline\" class=\"demo-underline\" onclick=\"return false\">Information\u003c/a>\n\u003c/div>\n\u003col>\n\u003cli>\u003ccode>a\u003c/code> に \u003ccode>position: relative\u003c/code>（下線の基準）と \u003ccode>display: inline-block\u003c/code>（文字の幅ぴったりの箱に）\u003c/li>\n\u003cli>\u003ccode>::after\u003c/code> で、リンクの下端に「幅100%・高さ1px」の線を置く\u003c/li>\n\u003cli>\u003ccode>transform: scaleX(0)\u003c/code> で横方向に0倍 ＝ \u003cstrong>最初は見えない\u003c/strong>\u003c/li>\n\u003cli>ホバーしたら \u003ccode>scaleX(1)\u003c/code> ＝ \u003cstrong>等倍に戻る\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>transform-origin: bottom left\u003c/code> で、伸び縮みの起点を左に ＝ \u003cstrong>左から伸びる\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>transition\u003c/code> で0.3秒かけて変化\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>width\u003c/code> を 0 → 100% に変化させても作れますが、\u003ccode>transform\u003c/code> のほうがブラウザの負担が少なく、なめらかに動きます。\u003c/p>\u003c/div>","lecture":"pseudo-elements","links":[["MDN: scaleX()","https://developer.mozilla.org/ja/docs/Web/CSS/transform-function/scaleX"],["MDN: transform-origin","https://developer.mozilla.org/ja/docs/Web/CSS/transform-origin"]],"spots":[{"file":"css","start":593,"end":623,"note":"","ref":false},{"file":"html","start":154,"end":158,"note":"フッターのメニュー","ref":true}]},{"id":"currentcolor","cat":"CSS","title":"currentcolor（文字色と同じ色）","body":"\u003cp>\u003ccode>currentcolor\u003c/code> は「\u003cstrong>その要素の文字色（color）と同じ色\u003c/strong>」を表すキーワードです。\u003c/p>\n\u003cp>下線の色を \u003ccode>currentcolor\u003c/code> にしておけば、リンクの文字色を変えたとき、下線の色も自動でそろいます。色を2か所に書く必要がありません。\u003c/p>\n\u003cp>疑似要素の背景、ボーダー、SVGアイコンの色などでよく使います。\u003c/p>","lecture":"currentcolor","links":[["MDN: currentcolor","https://developer.mozilla.org/ja/docs/Web/CSS/color_value#currentcolor_keyword"]],"spots":[{"file":"css","start":610,"end":611,"note":"","ref":false}]},{"id":"css-property-order","cat":"CSS","title":"プロパティを書く順番","body":"\u003cp>サンプルコードは授業で説明しながら書いた順になっていますが、実際の制作では、プロパティを\u003cstrong>一定のルールに沿った順番\u003c/strong>で書くことが推奨されます。\u003c/p>\n\u003cp>たとえば WordPress のCSSコーディング規約では、次の順番です。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>表示\u003c/strong>：\u003ccode>display\u003c/code>、\u003ccode>visibility\u003c/code>、\u003ccode>opacity\u003c/code> など\u003c/li>\n\u003cli>\u003cstrong>位置\u003c/strong>：\u003ccode>position\u003c/code>、\u003ccode>top\u003c/code>、\u003ccode>z-index\u003c/code> など\u003c/li>\n\u003cli>\u003cstrong>ボックスモデル\u003c/strong>：\u003ccode>width\u003c/code>、\u003ccode>margin\u003c/code>、\u003ccode>padding\u003c/code>、\u003ccode>border\u003c/code> など\u003c/li>\n\u003cli>\u003cstrong>色と文字\u003c/strong>：\u003ccode>color\u003c/code>、\u003ccode>font-size\u003c/code>、\u003ccode>background\u003c/code> など\u003c/li>\n\u003cli>\u003cstrong>その他\u003c/strong>：\u003ccode>transform\u003c/code>、\u003ccode>transition\u003c/code> など\u003c/li>\n\u003c/ol>\n\u003cp>これが唯一の正解ではありません。アルファベット順にする方法や、Stylelint・Prettier などのツールで自動整形する方法もあります。大切なのは、\u003cstrong>チームでルールを決めて、一貫して守る\u003c/strong>ことです。\u003c/p>","lecture":"css-property-order","links":[["WordPress CSS コーディング規約","https://ja.wordpress.org/team/handbook/coding-standards/wordpress-coding-standards/css/"],["MDN: CSS の整理","https://developer.mozilla.org/ja/docs/Learn/CSS/Building_blocks/Organizing"]],"spots":[]},{"id":"js-queryselector","cat":"JavaScript","title":"操作したい要素を取得する（querySelector）","body":"\u003cp>JavaScriptでHTMLを操作するには、まず\u003cstrong>操作したい要素をつかまえて\u003c/strong>、変数に入れておきます。\u003c/p>\n\u003cpre data-lang=\"js\">const menuButton = document.querySelector('.sp-menu');\u003c/pre>\n\u003cp>\u003ccode>document.querySelector()\u003c/code> のカッコの中には、\u003cstrong>CSSと同じセレクタ\u003c/strong>を書きます。\u003ccode>'.sp-menu'\u003c/code> なら「\u003ccode>sp-menu\u003c/code> クラスがついた最初の要素」です。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>menuButton\u003c/code> … ハンバーガーボタン\u003c/li>\n\u003cli>\u003ccode>headerNav\u003c/code> … メニュー本体（\u003ccode>&lt;nav&gt;\u003c/code>）\u003c/li>\n\u003cli>\u003ccode>header\u003c/code> … ヘッダー全体\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>const\u003c/code> は「あとから別のものを入れ直さない変数」の宣言です。基本は \u003ccode>const\u003c/code> を使い、入れ直す必要があるときだけ \u003ccode>let\u003c/code> を使います。\u003c/p>","lecture":"","links":[["MDN: Document.querySelector()","https://developer.mozilla.org/ja/docs/Web/API/Document/querySelector"],["MDN: const","https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Statements/const"]],"spots":[{"file":"js","start":1,"end":4,"note":"","ref":false},{"file":"html","start":27,"end":27,"note":".sp-menu","ref":true},{"file":"html","start":32,"end":32,"note":".header-nav","ref":true},{"file":"html","start":19,"end":19,"note":".header","ref":true}]},{"id":"js-class-toggle","cat":"JavaScript","title":"クラスの付け外しで見た目を切り替える","body":"\u003cp>このサイトのJavaScriptは、\u003cstrong>見た目を直接変えていません\u003c/strong>。やっているのは「クラスを付けたり外したりする」ことだけです。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>JavaScript\u003c/strong> … 「いつ」切り替えるか（クリックされた、スクロールした）\u003c/li>\n\u003cli>\u003cstrong>CSS\u003c/strong> … そのクラスが付いたとき「どう見えるか」\u003c/li>\n\u003c/ul>\n\u003ch3>例1：メニューの開閉\u003c/h3>\n\u003cp>ボタンがクリックされたら、ボタンとメニューの両方で \u003ccode>active\u003c/code> クラスを切り替えます。CSS側には \u003ccode>&amp;.active { transform: translateX(0); }\u003c/code> があるので、メニューが画面内に出てきます。\u003c/p>\n\u003ch3>例2：ヘッダーの影\u003c/h3>\n\u003cp>少しでもスクロールしていたら（\u003ccode>window.scrollY &gt; 0\u003c/code>）ヘッダーに \u003ccode>scrolled\u003c/code> を付け、いちばん上に戻ったら外します。CSS側の \u003ccode>&amp;.scrolled\u003c/code> で影がつきます。\u003c/p>\n\u003ch3>classList のメソッド\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>.add('名前')\u003c/code> … 付ける\u003c/li>\n\u003cli>\u003ccode>.remove('名前')\u003c/code> … 外す\u003c/li>\n\u003cli>\u003ccode>.toggle('名前')\u003c/code> … あれば外す、なければ付ける\u003c/li>\n\u003cli>\u003ccode>.contains('名前')\u003c/code> … 付いているか調べる（true / false）\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cp>うまく動かないときは、ブラウザの開発者ツールで「クラスが付いているか」を確認しましょう。クラスが付いていなければJSの問題、付いているのに見た目が変わらなければCSSの問題、と切り分けられます。\u003c/p>\u003c/div>","lecture":"js-class-toggle","links":[["MDN: Element.classList","https://developer.mozilla.org/ja/docs/Web/API/Element/classList"],["MDN: addEventListener()","https://developer.mozilla.org/ja/docs/Web/API/EventTarget/addEventListener"]],"spots":[{"file":"js","start":25,"end":30,"note":"JS：クリックで active を切り替え","ref":false},{"file":"css","start":191,"end":194,"note":"CSS：active のときメニューを表示","ref":false},{"file":"css","start":140,"end":161,"note":"CSS：active のとき×印に","ref":true},{"file":"js","start":63,"end":74,"note":"JS：スクロールで scrolled を付け外し","ref":false},{"file":"css","start":73,"end":76,"note":"CSS：scrolled のとき影をつける","ref":false}]},{"id":"js-aria","cat":"JavaScript","title":"【参考】aria属性の更新（アクセシビリティ）","body":"\u003cp>コメントに「★参考」とある部分は、スクリーンリーダーなどの支援技術に\u003cstrong>メニューの状態を正しく伝える\u003c/strong>ための処理です。見た目には影響しません。今は「こういう配慮があるんだな」と知っておけば十分です。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>aria-expanded\u003c/code>（ボタン側）… メニューが開いているか。開いたら \u003ccode>true\u003c/code>、閉じたら \u003ccode>false\u003c/code>\u003c/li>\n\u003cli>\u003ccode>aria-hidden\u003c/code>（メニュー側）… 支援技術から隠すか。閉じている間は \u003ccode>true\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>PC幅ではメニューが常に見えているので、\u003ccode>aria-hidden\u003c/code> があると「見えているのに読み上げられない」状態になってしまいます。そのため、画面幅を調べて（\u003ccode>window.matchMedia\u003c/code>）、PCのときは属性そのものを削除しています。ウィンドウ幅が変わったとき（\u003ccode>resize\u003c/code>）にも同じ確認をします。\u003c/p>","lecture":"hamburger-menu","links":[["MDN: aria-expanded","https://developer.mozilla.org/ja/docs/Web/Accessibility/ARIA/Attributes/aria-expanded"],["MDN: aria-hidden","https://developer.mozilla.org/ja/docs/Web/Accessibility/ARIA/Attributes/aria-hidden"],["MDN: Window.matchMedia()","https://developer.mozilla.org/ja/docs/Web/API/Window/matchMedia"]],"spots":[{"file":"js","start":6,"end":23,"note":"画面幅に応じて aria-hidden を制御","ref":false},{"file":"js","start":32,"end":40,"note":"開閉時に属性を更新","ref":false},{"file":"html","start":27,"end":27,"note":"aria-expanded の初期値","ref":true},{"file":"html","start":32,"end":32,"note":"aria-hidden の初期値","ref":true}]},{"id":"js-outside-click","cat":"JavaScript","title":"メニューの外側をクリックしたら閉じる","body":"\u003cp>開いたメニューの外側（暗くなっていない普通の部分）をタップしても、メニューが閉じるようにしています。\u003c/p>\n\u003col>\n\u003cli>\u003ccode>document\u003c/code>（ページ全体）でクリックを監視する\u003c/li>\n\u003cli>メニューが開いていなければ、何もせず終了（\u003ccode>return\u003c/code>）\u003c/li>\n\u003cli>クリックされた場所（\u003ccode>e.target\u003c/code>）が、ボタンの中でもメニューの中でも\u003cstrong>なければ\u003c/strong>、\u003ccode>active\u003c/code> を外して閉じる\u003c/li>\n\u003c/ol>\n\u003cp>\u003ccode>A.contains(B)\u003c/code> は「AがBを中に含んでいるか」を調べます。先頭の \u003ccode>!\u003c/code> は「〜ではない」という否定です。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>条件を満たさないときに先に \u003ccode>return\u003c/code> で抜ける書き方を「早期リターン」といいます。\u003ccode>if\u003c/code> の入れ子が深くならず、読みやすくなります。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: Node.contains()","https://developer.mozilla.org/ja/docs/Web/API/Node/contains"],["MDN: Event.target","https://developer.mozilla.org/ja/docs/Web/API/Event/target"]],"spots":[{"file":"js","start":43,"end":61,"note":"","ref":false}]},{"id":"js-smooth-scroll","cat":"JavaScript","title":"スムーススクロール（ヘッダーの高さを考慮）","body":"\u003cp>ページ内リンクをクリックしたとき、パッと飛ぶのではなく\u003cstrong>なめらかにスクロール\u003c/strong>させています。\u003c/p>\n\u003col>\n\u003cli>\u003ccode>a[href^=\"#\"]\u003c/code> で「\u003ccode>href\u003c/code> が \u003ccode>#\u003c/code> で始まるリンク」をすべて取得し、\u003ccode>forEach\u003c/code> で1つずつクリックの処理を登録\u003c/li>\n\u003cli>\u003ccode>e.preventDefault()\u003c/code> で、ブラウザ本来の「瞬間移動」を止める\u003c/li>\n\u003cli>\u003ccode>href\u003c/code> から \u003ccode>#\u003c/code> を取りのぞいた文字（\u003ccode>substring(1)\u003c/code>）で、移動先の要素を \u003ccode>getElementById\u003c/code> で探す\u003c/li>\n\u003cli>移動先の位置を計算し、\u003ccode>window.scrollTo({ behavior: 'smooth' })\u003c/code> でなめらかに移動\u003c/li>\n\u003cli>スマホでメニューが開いていたら閉じる\u003c/li>\n\u003c/ol>\n\u003ch3>なぜヘッダーの高さを引くの？\u003c/h3>\n\u003cp>ヘッダーは画面の上に固定されています。セクションの先頭ぴったりにスクロールすると、\u003cstrong>見出しがヘッダーの裏に隠れてしまいます\u003c/strong>。そこで \u003ccode>header.offsetHeight\u003c/code> でヘッダーの高さを調べ、その分だけ手前で止めています。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>CSSだけでも \u003ccode>html { scroll-behavior: smooth; }\u003c/code> と \u003ccode>scroll-margin-top\u003c/code> で近いことができます。JavaScriptで書くと、ヘッダーの高さが変わっても自動で対応でき、「メニューを閉じる」処理も一緒に行えます。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: Window.scrollTo()","https://developer.mozilla.org/ja/docs/Web/API/Window/scrollTo"],["MDN: Event.preventDefault()","https://developer.mozilla.org/ja/docs/Web/API/Event/preventDefault"],["MDN: scroll-behavior","https://developer.mozilla.org/ja/docs/Web/CSS/scroll-behavior"]],"spots":[{"file":"js","start":76,"end":115,"note":"","ref":false},{"file":"html","start":33,"end":37,"note":"対象になるリンク","ref":true},{"file":"css","start":54,"end":61,"note":"固定ヘッダー（隠れる原因）","ref":true}]}]};

/* ============ シンタックスハイライト ============ */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function scan(src, re, classes) {
	const out = [];
	let last = 0, m;
	re.lastIndex = 0;
	while ((m = re.exec(src))) {
		if (m[0] === '') { re.lastIndex++; continue; }
		if (m.index > last) out.push(['', src.slice(last, m.index)]);
		let cls = '';
		for (let i = 1; i < m.length; i++) if (m[i] !== undefined) { cls = classes[i - 1]; break; }
		out.push([cls, m[0]]);
		last = m.index + m[0].length;
	}
	if (last < src.length) out.push(['', src.slice(last)]);
	return out;
}

const RE_CSS = /(\/\*[\s\S]*?\*\/)|("[^"\n]*"|'[^'\n]*')|(@[\w-]+)|(--[\w-]+)|(#[0-9a-fA-F]{3,8}\b)|((?<![\w-])-?\d*\.?\d+(?:px|rem|em|vw|vh|deg|fr|s|%)?)|([\w-]+(?=\())|([a-z-]+(?=:\s))|(\.[\w-]+|&|::?[\w-]+)|([{}();,])/g;
const CL_CSS = ['c', 's', 'k', 'v', 'n', 'n', 'f', 'p', 't', 'x'];

const RE_JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|if|else|return|this|new|true|false|null|undefined|for|while|of|in)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*(?=\s*\())|((?<=\.)[A-Za-z_$][\w$]*)|(=>|[{}()[\];,.])/g;
const CL_JS = ['c', 's', 'k', 'n', 'f', 'p', 'x'];

const RE_HTML = /(<!--[\s\S]*?-->)|(<!DOCTYPE[^>]*>)|(<\/?[\w-]+(?:"[^"]*"|[^>"])*>)/gi;
const RE_TAG = /(<\/?|\/?>)|("[^"]*")|((?<=<\/?)[\w-]+)|([\w:-]+)/g;

function tokenize(src, lang) {
	if (lang === 'css') return scan(src, RE_CSS, CL_CSS);
	if (lang === 'js') return scan(src, RE_JS, CL_JS);
	const out = [];
	for (const [cls, text] of scan(src, RE_HTML, ['c', 'k', 'TAG'])) {
		if (cls === 'TAG') out.push(...scan(text, RE_TAG, ['x', 's', 't', 'a']));
		else out.push([cls, text]);
	}
	return out;
}

/* トークン列を行ごとのHTMLに変換（複数行コメントも行をまたいで色を維持） */
function toLines(src, lang) {
	const lines = [''];
	for (const [cls, text] of tokenize(src, lang)) {
		text.split('\n').forEach((part, i) => {
			if (i > 0) lines.push('');
			if (part) lines[lines.length - 1] += cls ? '<span class="t-' + cls + '">' + esc(part) + '</span>' : esc(part);
		});
	}
	return lines;
}

/* ============ データの準備 ============ */
const $ = s => document.querySelector(s);
const fileKeys = Object.keys(DATA.files);
const topics = DATA.topics;
const topicById = Object.fromEntries(topics.map(t => [t.id, t]));
const lineEls = {};   // file → [行要素]（1始まり）
const cover = {};     // file → [行ごとの {topic, spot} 配列（範囲が狭い順）]

for (const key of fileKeys) {
	const src = DATA.files[key].src.replace(/\n$/, '');
	const n = src.split('\n').length;
	cover[key] = Array.from({ length: n + 1 }, () => []);
}
for (const topic of topics) {
	for (const spot of topic.spots) {
		if (spot.ref) continue; // 参照用の場所は、クリックの対象にはしない
		for (let i = spot.start; i <= spot.end; i++) cover[spot.file][i].push({ topic, spot });
	}
}
for (const key of fileKeys) {
	for (const list of cover[key]) list.sort((a, b) => (a.spot.end - a.spot.start) - (b.spot.end - b.spot.start));
}

/* ============ コード表示の組み立て ============ */
const tabsEl = $('#tabs');
const scrollEl = $('#code-scroll');
const hintEl = $('#hint');
const HINT_DEFAULT = hintEl.textContent;

for (const key of fileKeys) {
	const file = DATA.files[key];
	const tab = document.createElement('button');
	tab.type = 'button';
	tab.className = 'tab';
	tab.setAttribute('role', 'tab');
	tab.dataset.file = key;
	tab.innerHTML = esc(file.name) + '<span class="dot"></span>';
	tab.addEventListener('click', () => showFile(key));
	tabsEl.appendChild(tab);

	const code = document.createElement('div');
	code.className = 'code';
	code.dataset.file = key;
	lineEls[key] = [null];
	toLines(file.src.replace(/\n$/, ''), file.lang).forEach((html, i) => {
		const n = i + 1;
		const ln = document.createElement('div');
		ln.className = 'ln' + (cover[key][n].length ? ' has' : '');
		ln.dataset.n = n;
		// 行頭のタブは余白に置き換える（折り返した2行目以降もインデントがそろう）
		let indent = 0;
		html = html.replace(/^(<span class="t-\w">)?(\t+)/, (m, open, tabs) => { indent = tabs.length; return open || ''; });
		ln.innerHTML = '<span class="no">' + n + '</span><span class="src" style="padding-left:' + indent * 2 + 'ch">' + (html || ' ') + '</span>';
		code.appendChild(ln);
		lineEls[key].push(ln);
	});
	scrollEl.appendChild(code);
}

let currentFile = null;
function showFile(key) {
	if (currentFile === key) return;
	currentFile = key;
	document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.file === key));
	document.querySelectorAll('.code').forEach(c => c.classList.toggle('show', c.dataset.file === key));
	scrollEl.scrollTop = 0;
}

/* ホバー：その行でいちばん範囲の狭い解説ブロックを薄く光らせる */
let hovered = null;
function setHover(entry, file) {
	if (hovered && entry && hovered.spot === entry.spot) return;
	if (hovered) for (let i = hovered.spot.start; i <= hovered.spot.end; i++) lineEls[hovered.spot.file][i].classList.remove('hov');
	hovered = entry || null;
	if (entry) {
		for (let i = entry.spot.start; i <= entry.spot.end; i++) lineEls[file][i].classList.add('hov');
		hintEl.innerHTML = 'クリックで解説 ▸ <b>' + esc(entry.topic.title) + '</b>';
	} else {
		hintEl.textContent = HINT_DEFAULT;
	}
}
function entryAt(target) {
	const ln = target.closest('.ln');
	if (!ln) return null;
	const file = ln.parentElement.dataset.file;
	const n = +ln.dataset.n;
	return { file, n, list: cover[file][n] };
}
scrollEl.addEventListener('mouseover', e => {
	const hit = entryAt(e.target);
	setHover(hit && hit.list[0], hit && hit.file);
});
scrollEl.addEventListener('mouseleave', () => setHover(null));
scrollEl.addEventListener('click', e => {
	if (String(window.getSelection()).length > 0) return; // コードをコピーしたいときは邪魔しない
	const hit = entryAt(e.target);
	if (!hit || !hit.list.length) return;
	const first = hit.list[0];
	const also = hit.list.slice(1).map(x => x.topic).filter((t, i, a) => t !== first.topic && a.indexOf(t) === i);
	select(first.topic, first.spot, { also, scrollCode: false });
});

/* ============ 選択と解説パネル ============ */
const panelEl = $('#panel');
const panelCol = $('#panel-col');
let state = { topic: null, spot: null };

function select(topic, spot, opt = {}) {
	// 以前の強調を消す
	if (state.topic) for (const s of state.topic.spots) for (let i = s.start; i <= s.end; i++) lineEls[s.file][i].classList.remove('sel', 'act');
	document.querySelectorAll('.tab').forEach(t => t.classList.remove('related'));

	state = { topic, spot: topic ? (spot || topic.spots[0] || null) : null };
	if (!topic) {
		renderIndex();
		setHash('');
		return;
	}
	for (const s of topic.spots) {
		for (let i = s.start; i <= s.end; i++) lineEls[s.file][i].classList.add(s === state.spot ? 'act' : 'sel');
		tabsEl.querySelector('[data-file="' + s.file + '"]').classList.add('related');
	}
	if (state.spot) {
		showFile(state.spot.file);
		if (opt.scrollCode !== false) {
			const el = lineEls[state.spot.file][state.spot.start];
			scrollEl.scrollTop = Math.max(0, el.offsetTop - scrollEl.offsetTop - 70);
		}
	}
	renderTopic(opt.also || [], opt.keepScroll);
	setHash(topic.id);
}

/* URLの末尾に #解説ID をつける（その解説を直接開けるリンクになる） */
function setHash(id) {
	try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) {}
}

function spotLabel(s) {
	const range = s.start === s.end ? s.start + '行目' : s.start + '–' + s.end + '行目';
	return '<span class="f">' + esc(DATA.files[s.file].name) + '</span><span class="r">' + range + '</span><span>' + esc(s.note || '') + '</span>';
}

function renderTopic(also, keepScroll) {
	const t = state.topic;
	const idx = topics.indexOf(t);
	const prev = topics[idx - 1], next = topics[idx + 1];
	let h = '<div class="crumbs"><button type="button" class="back" data-go="">← 解説一覧</button><span class="cat" data-cat="' + t.cat + '">' + t.cat + '</span></div>';
	h += '<h2>' + t.title + '</h2>';
	h += '<div class="body">' + t.body + '</div>';

	if (also.length) {
		h += '<div class="box"><h3>クリックした行には、ほかの解説もあります</h3><div>';
		for (const a of also) h += '<button type="button" class="also-btn" data-go="' + a.id + '">' + a.title + '</button>';
		h += '</div></div>';
	}
	if (t.spots.length) {
		h += '<div class="box"><h3>関連するコード（クリックで移動）</h3><ul class="spot-list">';
		t.spots.forEach((s, i) => {
			h += '<li><button type="button" class="spot-btn' + (s === state.spot ? ' cur' : '') + '" data-spot="' + i + '">' + spotLabel(s) + '</button></li>';
		});
		h += '</ul></div>';
	}
	if (t.links.length || t.lecture) {
		h += '<div class="box"><h3>📚 もっと詳しく</h3><ul class="ref-list">';
		for (const [label, url] of t.links) h += '<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(label) + '</a></li>';
		h += '</ul>';
		if (t.lecture && DATA.lectureUrl) h += '<a class="more-link" href="' + DATA.lectureUrl + '#' + t.lecture + '" target="_blank" rel="noopener">実装解説ページでくわしく読む →</a>';
		h += '</div>';
	}
	h += '<div class="pager">'
		+ '<button type="button" data-go="' + (prev ? prev.id : '') + '"' + (prev ? '' : ' disabled') + '>← ' + (prev ? prev.title : '') + '</button>'
		+ '<button type="button" data-go="' + (next ? next.id : '') + '"' + (next ? '' : ' disabled') + '>' + (next ? next.title : '') + ' →</button></div>';
	panelEl.innerHTML = h;
	highlightPanel();
	if (!keepScroll) panelCol.scrollTop = 0;
}

function renderIndex() {
	let h = '<h2>解説一覧</h2>'
		+ '<div class="howto"><span class="bar"></span><p>左のコードで、<b>左端にオレンジの印がある行</b>をクリックすると、その部分の解説がここに表示されます。<br>下の一覧から選ぶと、関係するコードの場所へジャンプします。</p></div>';
	for (const cat of ['HTML', 'CSS', 'JavaScript']) {
		const list = topics.filter(t => t.cat === cat);
		if (!list.length) continue;
		h += '<h3><span class="cat" data-cat="' + cat + '">' + cat + '</span></h3><ul class="index-list">';
		for (const t of list) {
			h += '<li><button type="button" class="index-btn" data-go="' + t.id + '"><span>' + t.title + '</span><span class="n">' + (t.spots.length ? t.spots.length + 'か所' : '読みもの') + '</span></button></li>';
		}
		h += '</ul>';
	}
	panelEl.innerHTML = h;
	panelCol.scrollTop = 0;
}

function highlightPanel() {
	panelEl.querySelectorAll('pre[data-lang]').forEach(pre => {
		pre.innerHTML = toLines(pre.textContent, pre.dataset.lang).join('\n');
	});
}

panelEl.addEventListener('click', e => {
	const demo = e.target.closest('[data-demo-toggle]');
	if (demo) { demo.classList.toggle('active'); return; }
	const go = e.target.closest('[data-go]');
	if (go) { select(go.dataset.go ? topicById[go.dataset.go] : null); return; }
	const sp = e.target.closest('[data-spot]');
	if (sp) select(state.topic, state.topic.spots[+sp.dataset.spot], { keepScroll: true });
});

document.addEventListener('keydown', e => {
	if (e.key === 'Escape' && state.topic) select(null);
});

/* ============ ヘッダーのリンク・文字サイズ ============ */
const linksEl = $('#app-links');
if (DATA.demoUrl) linksEl.innerHTML += '<a href="' + DATA.demoUrl + '" target="_blank" rel="noopener">完成ページ</a>';
if (DATA.lectureUrl) linksEl.innerHTML += '<a href="' + DATA.lectureUrl + '" target="_blank" rel="noopener">実装解説</a>';

let codeSize = 13;
try { codeSize = +localStorage.getItem('codeSize') || 13; } catch (e) {}
function applySize() { document.documentElement.style.setProperty('--code-size', codeSize + 'px'); }
applySize();
document.querySelectorAll('.size-btn').forEach(btn => btn.addEventListener('click', () => {
	codeSize = Math.min(22, Math.max(10, codeSize + +btn.dataset.size));
	applySize();
	try { localStorage.setItem('codeSize', codeSize); } catch (e) {}
}));

/* ============ 起動 ============ */
function fromHash() {
	const t = topicById[decodeURIComponent(location.hash.slice(1))];
	showFile(fileKeys[0]);
	select(t || null);
}
window.addEventListener('hashchange', () => {
	const t = topicById[decodeURIComponent(location.hash.slice(1))];
	if (t !== state.topic) select(t || null);
});
fromHash();
</script>
</body>
</html>
