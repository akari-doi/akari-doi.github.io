<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAL BAKERY & CAFE コード解説ビューア</title>
<meta name="description" content="HAL BAKERY & CAFE のサンプルコードを、クリックした箇所ごとに解説つきで読めるビューアです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
	--black: #333333;
	--white: #ffffff;
	--main: #4C310D;
	--accent: #496057;
	--bg: #F1EFEC;
	--bg-secondary: #E8E1D6;
	--line: #d9d0c2;
	--mark: #e0a04e;
	--code-bg: #26201c;
	--code-bg2: #2f2823;
	--code-text: #ece4d8;
	--code-size: 13px;
	--header-h: 52px;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
	font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
	font-weight: 500;
	font-size: 15px;
	line-height: 1.75;
	color: var(--black);
	background: var(--bg);
	overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

/* ---------- ヘッダー ---------- */
.app-header {
	display: flex;
	align-items: center;
	gap: 16px;
	height: var(--header-h);
	padding: 0 16px;
	background: var(--main);
	color: var(--white);
}
.app-title { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
.app-title small { margin-left: 10px; font-size: 12px; font-weight: 500; opacity: .75; }
.app-links { display: flex; gap: 8px; margin-left: auto; }
.app-links a, .size-btn {
	padding: 3px 12px;
	border: 1px solid rgb(255 255 255 / 35%);
	border-radius: 999px;
	background: transparent;
	color: var(--white);
	font-size: 12.5px;
	text-decoration: none;
	white-space: nowrap;
}
.app-links a:hover, .size-btn:hover { background: rgb(255 255 255 / 14%); }
.size-ctrl { display: flex; gap: 4px; }
.size-btn { padding: 3px 9px; }

/* ---------- レイアウト ---------- */
.app-main {
	display: grid;
	grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
	height: calc(100dvh - var(--header-h));
}
.code-col { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); }
.panel-col { min-height: 0; overflow-y: auto; background: var(--bg); scroll-behavior: smooth; }

/* ---------- ファイルタブ ---------- */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; background: #1b1613; }
.tab {
	position: relative;
	padding: 6px 16px 7px;
	border: 0;
	border-radius: 6px 6px 0 0;
	background: transparent;
	color: #a99d8f;
	font-family: var(--mono);
	font-size: 13px;
}
.tab:hover { color: var(--code-text); }
.tab[aria-selected="true"] { background: var(--code-bg); color: var(--white); }
.tab .dot {
	display: none;
	width: 7px; height: 7px;
	margin-left: 7px;
	border-radius: 50%;
	background: var(--mark);
	vertical-align: 1px;
}
.tab.related .dot { display: inline-block; }

/* ---------- コード ---------- */
.code-scroll { flex: 1; min-height: 0; overflow: auto; padding: 10px 0 60px; }
.code { display: none; font-family: var(--mono); font-size: var(--code-size); line-height: 1.7; color: var(--code-text); tab-size: 2; }
.code.show { display: block; }
.ln { display: flex; border-left: 3px solid transparent; }
.ln .no {
	flex: none;
	width: 3.6em;
	padding-right: 1em;
	color: #6f6558;
	text-align: right;
	user-select: none;
}
.ln .src { flex: 1; min-width: 0; padding-right: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.has { border-left-color: rgb(224 160 78 / 45%); cursor: pointer; }
.ln.has .no { color: #b58f5c; }
.ln.hov { background: rgb(255 255 255 / 7%); border-left-color: var(--mark); }
.ln.sel { background: rgb(224 160 78 / 10%); border-left-color: rgb(224 160 78 / 70%); }
.ln.act { background: rgb(224 160 78 / 20%); border-left-color: #ffbe63; }
.ln.act .no { color: #ffd08a; }

.hint-bar {
	flex: none;
	padding: 6px 14px;
	background: #1b1613;
	color: #b9ad9e;
	font-size: 12.5px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.hint-bar b { color: #ffcf8a; font-weight: 700; }

/* シンタックスハイライト */
.t-c { color: #a39887; }
.t-s { color: #a5cfa9; }
.t-k { color: #ee9a83; }
.t-n { color: #e2bd76; }
.t-p { color: #9fcbe3; }
.t-f { color: #cfb1e0; }
.t-t { color: #f0aa72; }
.t-a { color: #cdd58e; }
.t-v { color: #e2bd76; }
.t-x { color: #9c9184; }

/* ---------- 解説パネル ---------- */
.panel { max-width: 760px; margin: 0 auto; padding: 24px 28px 80px; }
.panel h2 { margin: 6px 0 14px; font-size: 22px; line-height: 1.4; color: var(--main); }
.panel h3 { margin: 26px 0 8px; font-size: 16px; color: var(--main); }
.panel p { margin: 0 0 12px; }
.panel ul, .panel ol { margin: 0 0 12px; padding-left: 1.4em; }
.panel li { margin-bottom: 4px; }
.panel code {
	padding: 1px 5px;
	border-radius: 4px;
	background: var(--bg-secondary);
	font-family: var(--mono);
	font-size: .88em;
}
.panel pre {
	margin: 0 0 14px;
	padding: 12px 14px;
	border-radius: 8px;
	background: var(--code-bg);
	color: var(--code-text);
	font-family: var(--mono);
	font-size: 12.5px;
	line-height: 1.65;
	tab-size: 2;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}
.panel .note {
	margin: 0 0 14px;
	padding: 10px 14px;
	border-left: 4px solid var(--accent);
	border-radius: 0 6px 6px 0;
	background: var(--white);
	font-size: 14px;
}
.panel .note > :last-child { margin-bottom: 0; }

.crumbs { display: flex; align-items: center; gap: 10px; }
.back {
	padding: 2px 12px;
	border: 1px solid var(--line);
	border-radius: 999px;
	background: var(--white);
	font-size: 12.5px;
}
.back:hover { border-color: var(--accent); }
.cat {
	display: inline-block;
	padding: 1px 10px;
	border-radius: 4px;
	background: var(--accent);
	color: var(--white);
	font-size: 12px;
	font-weight: 700;
}
.cat[data-cat="HTML"] { background: #a8572a; }
.cat[data-cat="JavaScript"] { background: #8a6a14; }

.box { margin-top: 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
.box h3 { margin: 0 0 8px; font-size: 14px; }
.spot-list, .ref-list, .also-list { margin: 0 !important; padding: 0 !important; list-style: none; }
.spot-btn {
	display: flex;
	align-items: baseline;
	gap: 10px;
	width: 100%;
	padding: 5px 8px;
	border: 0;
	border-radius: 6px;
	background: transparent;
	text-align: left;
	font-size: 13.5px;
}
.spot-btn:hover { background: var(--bg); }
.spot-btn.cur { background: #fbeed9; }
.spot-btn .f { flex: none; font-family: var(--mono); font-size: 12.5px; color: var(--main); font-weight: 700; }
.spot-btn .r { flex: none; font-family: var(--mono); font-size: 12px; color: #8a7d6c; }
.also-btn {
	margin: 0 6px 6px 0;
	padding: 3px 12px;
	border: 1px solid var(--line);
	border-radius: 999px;
	background: var(--bg);
	font-size: 13px;
}
.also-btn:hover { border-color: var(--accent); }
.ref-list li { margin: 0 0 3px; font-size: 13.5px; }
.more-link { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 700; }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
.pager button {
	flex: 1;
	min-width: 0;
	padding: 8px 12px;
	border: 1px solid var(--line);
	border-radius: 8px;
	background: var(--white);
	font-size: 13px;
	text-align: left;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.pager button:last-child { text-align: right; }
.pager button:hover { border-color: var(--accent); }
.pager button:disabled { visibility: hidden; }

/* 目次 */
.howto { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 8px; background: var(--white); border: 1px solid var(--line); }
.howto .bar { flex: none; width: 4px; height: 44px; border-radius: 2px; background: var(--mark); }
.howto p { margin: 0; font-size: 14px; }
.index-list { margin: 0 !important; padding: 0 !important; list-style: none; }
.index-btn {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	gap: 10px;
	width: 100%;
	padding: 6px 10px;
	border: 0;
	border-bottom: 1px solid var(--line);
	background: transparent;
	text-align: left;
	font-size: 14px;
}
.index-btn:hover { background: var(--white); }
.index-btn .n { flex: none; font-size: 11.5px; color: #8a7d6c; }

/* ---------- 解説内のミニデモ ---------- */
.demo { margin: 0 0 14px; padding: 16px; border: 1px dashed var(--line); border-radius: 8px; background: var(--white); }
.demo-cap { margin: 0 0 10px !important; font-size: 12.5px; color: #8a7d6c; }
.demo-burger { position: relative; width: 30px; height: 30px; padding: 0; border: 0; background: transparent; transform: scale(1.6); transform-origin: left center; margin: 8px 0 8px 6px; }
.demo-burger span { position: absolute; left: 5px; width: 20px; height: 1px; background-color: var(--black); transition: all .3s ease-in-out; }
.demo-burger span:nth-child(1) { top: 8px; }
.demo-burger span:nth-child(2) { top: 50%; transform: translateY(-50%); }
.demo-burger span:nth-child(3) { bottom: 8px; }
.demo-burger.active span:nth-child(1) { top: 50%; transform: translateY(-50%) rotate(45deg); }
.demo-burger.active span:nth-child(2) { opacity: 0; }
.demo-burger.active span:nth-child(3) { bottom: 50%; transform: translateY(50%) rotate(-45deg); }
.demo-underline { position: relative; display: inline-block; font-size: 18px; color: var(--black); text-decoration: none; }
.demo-underline::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; background-color: currentcolor; transform: scaleX(0); transform-origin: bottom left; transition: transform .3s ease-out; }
.demo-underline:hover::after { transform: scaleX(1); }
.demo-resize { resize: horizontal; overflow: hidden; width: 100%; min-width: 150px; max-width: 100%; padding: 10px; border: 2px solid var(--accent); border-radius: 6px; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 110px), 1fr)); gap: 8px; }
.demo-grid div { padding: 14px 0; border-radius: 4px; background: var(--bg-secondary); text-align: center; font-size: 13px; }
.demo-center { display: flex; gap: 16px; }
.demo-center > div { flex: 1; }
.demo-center .stage { position: relative; height: 70px; background: var(--bg); border-radius: 4px; }
.demo-center .stage::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #c0563a; }
.demo-center .bar { position: absolute; left: 20%; width: 60%; height: 20px; top: 50%; background: var(--accent); opacity: .85; }
.demo-center .ok .bar { transform: translateY(-50%); }
.demo-center p { margin: 6px 0 0 !important; font-size: 12.5px; text-align: center; }

/* ---------- スマホ・タブレット ---------- */
@media (width < 900px) {
	.app-title small, .size-ctrl { display: none; }
	.app-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
	.panel-col { border-top: 3px solid var(--main); }
	.panel { padding: 16px 16px 60px; }
	.panel h2 { font-size: 19px; }
}
</style>
</head>

		<button type="button" class="size-btn" data-size="1" aria-label="コードの文字を大きく">A＋</button>

</header>

<main class="app-main">

		<div class="panel" id="panel"></div>
	</section>
</main>

const DATA = {"lectureUrl":"https://akari-doi.github.io/wd16/hal-bakery-lecture.html","demoUrl":"","files":{"html":{"name":"index.html","lang":"html","src":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\n\u003chead>\n\t\u003cmeta charset=\"UTF-8\">\n\t\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\t\u003ctitle>HAL BAKERY & CAFE\u003c/title>\n\t\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\t\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\t\u003clink href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\"\n\t\trel=\"stylesheet\">\n\t\u003clink rel=\"stylesheet\" href=\"css/destyle.css\">\n\t\u003c!-- 自分の書くCSSは一番最後に読み込まれるようにします。でないと、リセットスタイルや他のライブラリなどのCSSを上書きすることができないからです。 -->\n\t\u003clink rel=\"stylesheet\" href=\"css/style.css\">\n\t\u003cscript src=\"js/main.js\" defer>\u003c/script>\n\u003c/head>\n\n\u003cbody>\n\t\u003cheader class=\"header\">\n\t\t\u003cdiv class=\"header-inner\">\n\t\t\t\u003ch1 class=\"header-logo\">\n\t\t\t\t\u003c!-- サーバーにアップしたら/（スラッシュ）のみのパスを指定でもOK（ルート相対パス）。相対パスで書くなら./（ドットスラッシュ）でもOKです。 -->\n\t\t\t\t\u003ca href=\"index.html\" class=\"logo\">\t\n\t\t\t\t\t\u003cimg src=\"images/logo.svg\" alt=\"HAL BAKERY & CAFE\">\n\t\t\t\t\u003c/a>\n\t\t\t\u003c/h1>\n\t\t\t\u003cbutton type=\"button\" class=\"sp-menu\" aria-label=\"メニュー\" aria-controls=\"header-nav\" aria-expanded=\"false\">\n\t\t\t\t\u003cspan>\u003c/span>\n\t\t\t\t\u003cspan>\u003c/span>\n\t\t\t\t\u003cspan>\u003c/span>\n\t\t\t\u003c/button>\n\t\t\t\u003cnav class=\"header-nav\" id=\"header-nav\" aria-hidden=\"true\">\n\t\t\t\t\u003cul class=\"header-nav-list\">\n\t\t\t\t\t\u003cli>\u003ca href=\"#pick-up\">Pick Up\u003c/a>\u003c/li>\n\t\t\t\t\t\u003cli>\u003ca href=\"#information\">Information\u003c/a>\u003c/li>\n\t\t\t\t\t\u003cli>\u003ca href=\"#news\">News\u003c/a>\u003c/li>\n\t\t\t\t\u003c/ul>\n\t\t\t\u003c/nav>\n\t\t\u003c/div>\n\t\u003c/header>\n\n\t\u003cmain>\n\t\t\u003cpicture class=\"mv\">\n\t\t\t\u003csource media=\"(min-width: 768px)\" srcset=\"images/mv-pc.jpg\">\n\t\t\t\u003cimg src=\"images/mv-sp.jpg\" alt=\"HAL BAKERY & CAFEの店内の様子\">\n\t\t\u003c/picture>\n\n\t\t\u003csection class=\"section section-catch-copy\">\n\t\t\t\u003cdiv class=\"section-inner\">\n\t\t\t\t\u003ch2 class=\"section-title\">\n\t\t\t\t\t焼き立てパンで、\u003cbr class=\"sp-only\">いつもの朝が、\u003cbr class=\"sp-only\">ちょっと特別に\n\t\t\t\t\u003c/h2>\n\t\t\t\t\u003cp class=\"catch-copy-text\">\n\t\t\t\t\tHAL BAKERY & CAFEは、地元大阪で愛される小さなベーカリーカフェです。\u003cbr>\n\t\t\t\t\t毎朝5時から焼き上げる自家製パンとこだわりのコーヒーで、皆様の一日のはじまりを応援します。\u003cbr>\n\t\t\t\t\tテイクアウトはもちろん、店内でもゆっくりお楽しみいただけます。\n\t\t\t\t\u003c/p>\n\t\t\t\u003c/div>\n\t\t\u003c/section>\n\n\t\t\u003csection class=\"section section-pick-up\" id=\"pick-up\">\n\t\t\t\u003cdiv class=\"section-inner\">\n\t\t\t\t\u003ch2 class=\"section-title\">Pick Up\u003c/h2>\n\t\t\t\t\u003cdiv class=\"pick-up-list\">\n\t\t\t\t\t\u003cdiv class=\"pick-up-item\">\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-text\">\n\t\t\t\t\t\t\t\u003ch3 class=\"pick-up-item-title\">ハニーレモンスコーン\u003c/h3>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-description\">\n\t\t\t\t\t\t\t\t国産レモンとはちみつを使った爽やかな甘さのスコーン。外はサクッと、中はしっとり。紅茶と一緒にどうぞ。\n\t\t\t\t\t\t\t\u003c/p>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-price\">価格:320円\u003c/p>\n\t\t\t\t\t\t\t\u003cbutton type=\"button\" class=\"pick-up-item-button\">詳細はこちら\u003c/button>\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-image\">\n\t\t\t\t\t\t\t\u003cimg src=\"images/item-01.jpg\" alt=\"ハニーレモンスコーン\">\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003cdiv class=\"pick-up-item\">\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-text\">\n\t\t\t\t\t\t\t\u003ch3 class=\"pick-up-item-title\">クロワッサン\u003c/h3>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-description\">\n\t\t\t\t\t\t\t\tバターの香り豊かな、サクサクの層が自慢の定番クロワッサン。そのままでも、サンドイッチにしても美味しい一品です。\n\t\t\t\t\t\t\t\u003c/p>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-price\">価格:280円\u003c/p>\n\t\t\t\t\t\t\t\u003cbutton type=\"button\" class=\"pick-up-item-button\">詳細はこちら\u003c/button>\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-image\">\n\t\t\t\t\t\t\t\u003cimg src=\"images/item-02.jpg\" alt=\"クロワッサン\">\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003cdiv class=\"pick-up-item\">\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-text\">\n\t\t\t\t\t\t\t\u003ch3 class=\"pick-up-item-title\">シナモンロール\u003c/h3>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-description\">\n\t\t\t\t\t\t\t\tたっぷりのシナモンシュガーとクリームチーズのアイシングが絶妙なバランス。甘さ控えめで、コーヒーとの相性抜群。\n\t\t\t\t\t\t\t\u003c/p>\n\t\t\t\t\t\t\t\u003cp class=\"pick-up-item-price\">価格:350円\u003c/p>\n\t\t\t\t\t\t\t\u003cbutton type=\"button\" class=\"pick-up-item-button\">詳細はこちら\u003c/button>\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\u003cdiv class=\"pick-up-item-image\">\n\t\t\t\t\t\t\t\u003cimg src=\"images/item-03.jpg\" alt=\"シナモンロール\">\n\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003c/div>\n\t\t\t\t\u003c/div>\n\t\t\t\u003c/div>\n\t\t\u003c/section>\n\n\t\t\u003csection class=\"section section-information\" id=\"information\">\n\t\t\t\u003cdiv class=\"section-inner\">\n\t\t\t\t\u003ch2 class=\"section-title\">Information\u003c/h2>\n\t\t\t\t\u003cdiv class=\"information-text\">\n\t\t\t\t\t\u003cp>530-0001 大阪市北区梅田3-3-1\u003c/p>\n\t\t\t\t\t\u003cp class=\"information-text-time\">営業時間:8:00〜18:00\u003c/p>\n\t\t\t\t\u003c/div>\n\t\t\t\t\u003cdiv class=\"information-map\">\n\t\t\t\t\t\u003ciframe\n\t\t\t\t\t\tsrc=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3280.211564797387!2d135.4930463!3d34.6998434!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6000e728ba376c79%3A0x3880b1f8cc20187e!2zSEFM5aSn6Ziq!5e0!3m2!1sja!2sjp!4v1763974745012!5m2!1sja!2sjp\"\n\t\t\t\t\t\twidth=\"600\" height=\"450\" style=\"border:0;\" allowfullscreen=\"\" loading=\"lazy\"\n\t\t\t\t\t\treferrerpolicy=\"no-referrer-when-downgrade\">\u003c/iframe>\n\t\t\t\t\u003c/div>\n\t\t\t\u003c/div>\n\t\t\u003c/section>\n\n\t\t\u003csection class=\"section section-news\" id=\"news\">\n\t\t\t\u003cdiv class=\"section-inner\">\n\t\t\t\t\u003ch2 class=\"section-title\">News\u003c/h2>\n\t\t\t\t\u003cul class=\"news-contents\">\n\t\t\t\t\t\u003cli class=\"news-item\">\n\t\t\t\t\t\t\u003ctime class=\"news-item-date\" datetime=\"2026-01-15\">2026.01.15\u003c/time>\n\t\t\t\t\t\t\u003cp class=\"news-item-title\">冬季限定スープセット好評販売中\u003c/p>\n\t\t\t\t\t\t\u003cp class=\"news-item-text\">温かいスープとパンのセットメニューが大好評です。2月末までの期間限定となりますので、まだお試しでない方はぜひこの機会にご賞味ください。\u003c/p>\n\t\t\t\t\t\u003c/li>\n\t\t\t\t\t\u003cli class=\"news-item\">\n\t\t\t\t\t\t\u003ctime class=\"news-item-date\" datetime=\"2025-12-20\">2025.12.20\u003c/time>\n\t\t\t\t\t\t\u003cp class=\"news-item-title\">クリスマス限定商品のご案内\u003c/p>\n\t\t\t\t\t\t\u003cp class=\"news-item-text\">クリスマスシュトーレンとジンジャーブレッドクッキーの予約を承っております。数量限定となりますので、お早めにご予約ください。\u003c/p>\n\t\t\t\t\t\u003c/li>\n\t\t\t\t\t\u003cli class=\"news-item\">\n\t\t\t\t\t\t\u003ctime class=\"news-item-date\" datetime=\"2025-12-15\">2025.12.15\u003c/time>\n\t\t\t\t\t\t\u003cp class=\"news-item-title\">年末年始の営業について\u003c/p>\n\t\t\t\t\t\t\u003cp class=\"news-item-text\">12月30日から1月3日まで年末年始休業とさせていただきます。1月4日より通常営業いたします。新年も皆様のご来店を心よりお待ちしております。\u003c/p>\n\t\t\t\t\t\u003c/li>\n\t\t\t\t\u003c/ul>\n\t\t\t\u003c/div>\n\t\t\u003c/section>\n\t\u003c/main>\n\n\t\u003cfooter class=\"footer\">\n\t\t\u003cdiv class=\"footer-inner\">\n\t\t\t\u003cdiv class=\"footer-nav\">\n\t\t\t\t\u003cdiv class=\"footer-logo\">\n\t\t\t\t\t\u003cimg src=\"images/logo.svg\" alt=\"HAL BAKERY & CAFE\">\n\t\t\t\t\u003c/div>\n\t\t\t\t\u003cul class=\"footer-menu\">\n\t\t\t\t\t\u003cli>\u003ca href=\"#pick-up\">Pick Up\u003c/a>\u003c/li>\n\t\t\t\t\t\u003cli>\u003ca href=\"#information\">Information\u003c/a>\u003c/li>\n\t\t\t\t\t\u003cli>\u003ca href=\"#news\">News\u003c/a>\u003c/li>\n\t\t\t\t\u003c/ul>\n\t\t\t\u003c/div>\n\t\t\t\u003cp class=\"footer-copyright\">\n\t\t\t\t\u003csmall>© 2025 HAL BAKERY & CAFE\u003c/small>\n\t\t\t\u003c/p>\n\t\t\u003c/div>\n\t\u003c/footer>\n\n\u003c/body>\n\n\u003c/html>"},"css":{"name":"style.css","lang":"css","src":"@charset \"UTF-8\";\n\n/*****************************************************\n\tリセット & ベース\n*****************************************************/\n\n/* 画像の比率を維持しながら最大幅を元の画像の大きさ（100%）にする */\nimg {\n\tmax-width: 100%;\n\theight: auto;\n}\n\n/* \n * CSS変数（カスタムプロパティ）の設定\n * プロジェクト全体で使う色をここで一括管理します。\n * 後から色を変更したくなった際、ここ1箇所を変えるだけで全ページに反映されるため、保守性が高まります。\n */\n:root {\n\t--black: #333333;\n\t--white: #ffffff;\n\t--main: #4C310D;\n\t--accent: #496057;\n\t--bg: #F1EFEC;\n\t--bg-secondary: #E8E1D6;\n}\n\n/* \n * overflow-x: clip は、コンテンツが画面の横幅を突き抜けてしまった時に\n * 勝手に横スクロールが発生するのを防ぐ設定です。\n * 意図しない横揺れやガタつきを防ぐための保険的な役割を果たします。\n */\nhtml {\n\toverflow-x: clip;\n}\n\nbody {\n\tfont-family: \"Zen Kaku Gothic New\", sans-serif;\n\tfont-weight: 500;\n\tfont-size: 1rem;\n\tline-height: 1.6;\n\tcolor: var(--black);\n\tbackground: var(--bg);\n\toverflow-x: clip;\n}\n\n\n/*****************************************************\n\tヘッダー\n*****************************************************/\n.header {\n\tdisplay: flex;\n\tjustify-content: center;\n\talign-items: center;\n\t/* \n\t * position: sticky は、スクロールしても画面上部に残り続ける設定です。\n\t * top: 0 とセットで使うことで、天井に張り付くような挙動になります。\n\t * z-index は「重なりの順序」です。メインコンテンツより上に表示するために 2 を指定しています。\n\t */\n\tposition: sticky;\n\tz-index: 2;\n\ttop: 0;\n\tpadding: 15px 15px 15px 20px;\n\tbackground-color: var(--bg);\n\t/* box-shadow（影）がつく際の変化を 0.3秒かけて滑らかにします */\n\t/* transitionを適用するプロパティにbox-shadow（影）のみを指定していますが、「all」にすると変化するすべてのプロパティにtransitionを適用します */\n\ttransition: box-shadow 0.3s ease;\n\n\t/* 「ウインドウ幅が769px以上になったら」というメディアクエリの書き方です */\n\t@media (width >= 769px) {\n\t\tpadding: 24px 20px;\n\t}\n\n\t/* JavaScriptでスクロールを検知した時に追加されるクラス */\n\t&.scrolled {\n\t\tbox-shadow: 0 2px 8px rgb(76 49 13 / 10%);\n\t}\n}\n\n.header-inner {\n\tdisplay: flex;\n\tjustify-content: space-between;\n\talign-items: center;\n\twidth: 100%;\n\tmax-width: 1160px;\n}\n\n/* \n * line-height: 1 を指定すると、文字の上下にある余計な隙間（行間）が消えます。\n */\n.header-logo {\n\tline-height: 1;\n}\n\n/********** ハンバーガーメニュー **********/\n/* ハンバーガーメニューのボタン全体の枠 */\n.sp-menu {\n\tposition: relative;\n\t/* 子要素の span (3本線) を絶対配置するための基準点に設定 */\n\twidth: 30px;\n\t/* ボタンの幅 */\n\theight: 30px;\n\t/* ボタンの高さ */\n\n\t/* 3本の線の共通設定 */\n\tspan {\n\t\t/* 線の幅 */\n\t\twidth: 20px;\n\t\t/* 線の高さ（太さ） */\n\t\theight: 1px;\n\t\t/* 線の色 */\n\t\tbackground-color: var(--black);\n\t\t/* アニメーションの設定（0.3秒かけて滑らかに変化） */\n\t\ttransition: all 0.3s ease-in-out;\n\t\t/* 親要素(.sp-menu)を基準に自由に配置できるようにします */\n\t\tposition: absolute;\n\t\t/* 左から5pxの位置に配置（ボタン幅30px - 線幅20px = 余白10px。その半分の5pxで左右中央） */\n\t\tleft: 5px;\n\t}\n\n\t/* 1本目の線 */\n\tspan:nth-child(1) {\n\t\t/* 上から8pxの位置 */\n\t\ttop: 8px;\n\t}\n\n\t/* 2本目の線（真ん中） */\n\tspan:nth-child(2) {\n\t\t/* 上から50%の位置（中央） */\n\t\ttop: 50%;\n\t\t/* 線の太さの半分だけ上にずらして、完全に垂直中央にします */\n\t\ttransform: translateY(-50%);\n\t}\n\n\t/* 3本目の線 */\n\tspan:nth-child(3) {\n\t\t/* 下から8pxの位置 */\n\t\tbottom: 8px;\n\t}\n\n\t/* \n\t * メニューが開いている状態 (.activeクラスが付いたとき) のデザイン\n\t * 上下の線を中央に集めてから 45度回転させ、×印を作ります。\n\t */\n\t&.active span:nth-child(1) {\n\t\t/* 上下中央に移動 */\n\t\ttop: 50%;\n\t\t/* 中央補正しつつ、45度回転 */\n\t\ttransform: translateY(-50%) rotate(45deg);\n\t}\n\n\t&.active span:nth-child(2) {\n\t\t/* 真ん中の線は不要なので透明にして隠します */\n\t\topacity: 0;\n\t}\n\n\t&.active span:nth-child(3) {\n\t\t/* 上下中央に移動 */\n\t\tbottom: 50%;\n\t\t/* 中央補正しつつ、逆方向に45度回転 */\n\t\ttransform: translateY(50%) rotate(-45deg);\n\t}\n\n\t/* 画面幅が769px以上（PCなど）の時は非表示にする */\n\t@media (width >= 769px) {\n\t\tdisplay: none;\n\t}\n}\n\n/********** ナビゲーション **********/\n.header-nav {\n\t/* \n\t * 【スマホ時のスライドメニューの実装】\n\t * position: fixed で画面全体に対して固定配置します。\n\t * transform: translateX(-120%) で、最初は画面の左外側（120%分左）に隠しておきます。\n\t */\n\tposition: fixed;\n\ttop: 0;\n\tleft: 0;\n\twidth: 300px;\n\t/* 画面の高さいっぱいまで */\n\theight: 100vh;\n\t/* 95%の背景色と5%の透明色を混ぜる */\n\tbackground-color: color-mix(in srgb, var(--bg) 95%, transparent);\n\tbox-shadow: 2px 0 4px rgb(76 49 13 / 10%);\n\tz-index: 10;\n\t/* 画面外に移動 */\n\ttransform: translateX(-120%);\n\t/* transitionを適用するプロパティにtransform（回転、拡大縮小、傾斜、移動）のみを指定していますが、「all」にすると変化するすべてのプロパティにtransitionを適用します */\n\ttransition: transform 0.3s ease-in-out;\n\n\t&.active {\n\t\t/* JSで「active」クラスが付与された際、画面内に戻します */\n\t\ttransform: translateX(0);\n\t}\n\n\t@media (width >= 769px) {\n\t\t/* PC時はスライドメニューの機能を解除し、通常の表示に戻します */\n\t\tposition: static;\n\t\twidth: auto;\n\t\theight: auto;\n\t\tbackground-color: transparent;\n\t\tbox-shadow: none;\n\t\tz-index: auto;\n\t\ttransform: none;\n\t}\n}\n\n.header-nav-list {\n\tmargin-top: 40px;\n\tpadding: 0 20px;\n\n\t@media (width >= 769px) {\n\t\tdisplay: flex;\n\t\tcolumn-gap: 30px;\n\t\tmargin-top: 0;\n\t\tpadding: 0;\n\t}\n\n\tli {\n\t\t/* スマホ用メニューの区切り線。色の明度をわずかに下げて表現しています */\n\t\tborder-bottom: 1px solid color-mix(in srgb, var(--bg-secondary), var(--black) 5%);\n\n\t\t@media (width >= 769px) {\n\t\t\tborder-bottom: none;\n\t\t}\n\n\t\ta {\n\t\t\t/* aタグは本来インライン要素ですが、blockにすることで\n\t\t\t   行全体や余白（padding）も含めてクリックしやすくします */\n\t\t\tdisplay: block;\n\t\t\tpadding: 10px 0;\n\n\t\t\t@media (width >= 769px) {\n\t\t\t\tpadding: 0;\n\t\t\t}\n\t\t}\n\t}\n}\n\n/*****************************************************\n\t共通\n*****************************************************/\n/* SPのみ改行 */\n.sp-only {\n\t@media (width >= 769px) {\n\t\tdisplay: none;\n\t}\n}\n\n.section {\n\t/* \n\t * 各セクションの上下の余白を一貫させる設定です。\n\t */\n\tpadding: 60px 20px;\n\n\t@media (width >= 769px) {\n\t\tpadding: 80px 20px;\n\t}\n}\n\n.section-title {\n\tfont-size: calc(26 / 16 * 1rem);\n\t/* 26pxをremに変換 (26 / 16 = 1.625rem) */\n\tfont-weight: 700;\n\tline-height: 1.3;\n\ttext-align: center;\n\tcolor: var(--main);\n\n\t@media (width >= 769px) {\n\t\tfont-size: calc(28 / 16 * 1rem);\n\t}\n}\n\n.section-inner {\n\t/* \n\t * コンテンツが画面いっぱいに広がりすぎないよう、最大幅（max-width）を制限し、\n\t * margin: 0 auto で左右を自動計算させて中央に配置します。\n\t */\n\twidth: 100%;\n\tmax-width: 1160px;\n\tmargin: 0 auto;\n}\n\n\n/*****************************************************\n\tメインビジュアル\n*****************************************************/\n.mv {\n\timg {\n\t\t/* 親要素の幅いっぱいに広げ、隙間なく表示させます */\n\t\twidth: 100%;\n\t}\n}\n\n\n/*****************************************************\n\tキャッチコピー\n*****************************************************/\n.catch-copy-text {\n\tmargin-top: 30px;\n\tline-height: 1.8;\n\n\t@media (width >= 769px) {\n\t\ttext-align: center;\n\t}\n}\n\n\n/*****************************************************\n\tPick Up\n*****************************************************/\n.section-pick-up {\n\tbackground-color: var(--bg-secondary);\n\tpadding-bottom: 80px;\n\n\t@media (width >= 769px) {\n\t\tpadding-bottom: 100px;\n\t}\n}\n\n.pick-up-list {\n\t/* \n\t * 【レスポンシブな自動グリッドレイアウト】\n\t * display: grid を使い、画面幅に応じてカラム数を自動調整します。\n\t * \n\t * auto-fit: 画面幅に応じて、詰め込めるだけカラムを並べます。\n\t * minmax(最小値, 最大値): カラムの幅の範囲を指定\n\t *   - 最小値: min(100%, 228px) = 親要素の100%幅と228pxを比べて小さい方になる（今回228pxにしたのはタブレット768pxのときは3カラムにしたかったから）\n\t *     → 通常は228pxが最小値、現在のSPデバイスではありえないが極小画面では100%に収める(はみ出し防止)\n\t *   - 最大値: 1fr = 余ったスペースを均等に分配(各カラムが同じ幅になる)\n\t * \n\t * .pick-up-itemの幅が228px未満になったとき、カラム落ちしていきます。\n\t * （今回だとウインドウ幅が763px未満になったとき2カラムに。515px未満になったとき1カラムになります。）\n\t * カラム落ちしたら「1fr = 余ったスペースを均等に分配」されるため、幅は横幅いっぱいになり隙間はできません。\n\t * \n\t * 結果: メディアクエリを使わずに、画面幅に応じて1〜3カラムに自動調整され、各カラムは等幅になります\n\t */\n\tdisplay: grid;\n\tgrid-template-columns: repeat(auto-fit, minmax(min(100%, 228px), 1fr));\n\tgap: 30px 20px;\n\tmargin-top: 30px;\n}\n\n.pick-up-item {\n\t/* \n\t * flex-direction: column-reverse を使うことで、\n\t * HTMLの記述順（テキスト → 画像）に関わらず、\n\t * 視覚的な表示順（画像が上、テキストが下）を逆にしています。\n\t * ブラウザやスクリーンリーダーには本来の順序（テキストから）で読ませたい場合に有効なテクニックです。\n\t */\n\tdisplay: flex;\n\tflex-direction: column-reverse;\n\tjustify-content: flex-end;\n\tbackground-color: var(--white);\n\tborder-radius: 8px;\n\tbox-shadow: 2px 2px 4px rgb(76 49 13 / 10%);\n\t/* 子要素の画像が角丸からはみ出さないように設定します */\n\toverflow: hidden;\n}\n\n.pick-up-item-image {\n\t/* \n\t * 今回は各商品の画像の幅が670pxあるので、515pxより大きいため、隙間ができてしまうことはありませんが、\n\t * もし小さい画像を使ってたとしても横幅いっぱいに広がるように念のためwidth:100%;を設定しています。\n\t */\n\timg {\n\t\twidth: 100%;\n\t}\n}\n\n.pick-up-item-text {\n\tpadding: 20px;\n}\n\n.pick-up-item-title {\n\tfont-size: 18px;\n\tfont-weight: 700;\n\tcolor: var(--main);\n}\n\n.pick-up-item-description {\n\tmargin-top: 15px;\n}\n\n.pick-up-item-price {\n\tmargin-top: 15px;\n}\n\n.pick-up-item-button {\n\tdisplay: flex;\n\talign-items: center;\n\tjustify-content: center;\n\tcolumn-gap: 20px;\n\twidth: 100%;\n\tmargin-top: 15px;\n\tpadding: 12px 20px;\n\tbackground-color: var(--accent);\n\tcolor: var(--white);\n\t/* 18pxをremに変換 */\n\tfont-size: calc(18 / 16 * 1rem);\n\tfont-weight: 700;\n\ttext-align: center;\n\tborder-radius: 4px;\n\t/* transitionを適用するプロパティにopacity（不透明度）のみを指定していますが、「all」にすると変化するすべてのプロパティにtransitionを適用します */\n\ttransition: opacity 0.3s;\n\n\t&:hover {\n\t\topacity: 0.8;\n\t}\n\n\t/* \n\t * 【疑似要素によるアイコンの表示】\n\t * 矢印アイコンを疑似要素で実装しています。\n\t * background-image を使うことで、HTMLを汚さずに装飾（アイコン）を追加できます。\n\t */\n\t&::after {\n\t\tcontent: \"\";\n\t\tdisplay: inline-block;\n\t\twidth: 9px;\n\t\theight: 15px;\n\t\tbackground-image: url('../images/icon-arrow-white.svg');\n\t\tbackground-size: contain;\n\t\tbackground-repeat: no-repeat;\n\t}\n}\n\n\n/*****************************************************\n\tInformation\n*****************************************************/\n.section-information {\n\tpadding-bottom: 80px;\n\n\t@media (width >= 769px) {\n\t\tpadding-bottom: 100px;\n\t}\n}\n\n.information-text {\n\t/* \n\t * width: fit-content は「ブロックレベルのコンテンツをその要素の内容の幅にする」設定です。\n\t * これにより、margin: 30px auto で内容を中央に寄せることができます。\n\t */\n\twidth: fit-content;\n\tmargin: 30px auto 0;\n}\n\n.information-text-time {\n\tmargin-top: 10px;\n}\n\n.information-map {\n\t/* \n\t * 【スマホ時の全幅表示テクニック】\n\t * 親要素の左右パディングを無視して、画面の端から端まで（100vw）表示させます。\n\t * 左右にネガティブマージン（計算式）を当てることで実現しています。\n\t */\n\twidth: 100vw;\n\tmargin: 20px calc(50% - 50vw) 0;\n\n\t@media (width >= 769px) {\n\t\t/* PC時は画面幅に合わせて通常の表示に戻します */\n\t\twidth: auto;\n\t\tmargin: 20px 0 0;\n\t}\n\n\tiframe {\n\t\twidth: 100%;\n\t\theight: 300px;\n\n\t\t@media (width >= 769px) {\n\t\t\theight: 400px;\n\t\t}\n\t}\n}\n\n\n/*****************************************************\n\tNews\n*****************************************************/\n.section-news {\n\tbackground-color: var(--main);\n\tpadding-bottom: 80px;\n\n\t.section-title {\n\t\tcolor: var(--white);\n\t}\n\n\t@media (width >= 769px) {\n\t\tpadding-bottom: 100px;\n\t}\n}\n\n.news-contents {\n\tmargin-top: 30px;\n\tpadding: 30px;\n\tbackground-color: var(--white);\n\tdisplay: flex;\n\tflex-direction: column;\n\trow-gap: 30px;\n}\n\n.news-item {\n\t@media (width >= 769px) {\n\t\t/* \n\t\t * PC時は Grid を使って、\n\t\t * 「日付とタイトルを横並び、本文をその下」という変則的な配置を制御します。\n\t\t */\n\t\tdisplay: grid;\n\t\tgrid-template-columns: auto 1fr;\n\t\t/* 日付は中身に合わせ、タイトルは残り全部 */\n\t\tgap: 0 20px;\n\t\talign-items: start;\n\t}\n}\n\n.news-item-date {\n\tdisplay: inline-block;\n\twidth: fit-content;\n\tpadding: 2px 20px;\n\tbackground-color: var(--accent);\n\tcolor: var(--white);\n\tfont-weight: 500;\n\n\t@media (width >= 769px) {\n\t\t/* 1行目・1列目に配置します */\n\t\tgrid-row: 1;\n\t\tgrid-column: 1;\n\t}\n}\n\n.news-item-title {\n\tmargin-top: 10px;\n\tfont-size: 16px;\n\tfont-weight: 700;\n\tcolor: var(--main);\n\n\t@media (width >= 769px) {\n\t\tmargin-top: 0;\n\t\t/* 1行目・2列目に配置します */\n\t\tgrid-row: 1;\n\t\tgrid-column: 2;\n\t}\n}\n\n.news-item-text {\n\tmargin-top: 10px;\n\n\t@media (width >= 769px) {\n\t\t/* \n\t\t * 2行目に配置。\n\t\t * grid-column: 1 / -1 は1列目から最後の列目まで（-1は最後）貫通させる指定です。\n\t\t */\n\t\tgrid-row: 2;\n\t\tgrid-column: 1 / -1;\n\t}\n}\n\n\n/*****************************************************\n\tフッター\n*****************************************************/\n.footer {\n\tpadding: 40px 20px;\n}\n\n.footer-inner {\n\twidth: 100%;\n\tmax-width: 1160px;\n\tmargin: 0 auto;\n}\n\n.footer-nav {\n\t@media (width >= 769px) {\n\t\tdisplay: flex;\n\t\tflex-direction: row;\n\t\tjustify-content: space-between;\n\t\talign-items: center;\n\t}\n}\n\n.footer-logo {\n\tline-height: 1;\n}\n\n.footer-menu {\n\tdisplay: flex;\n\tflex-direction: column;\n\tgap: 10px 0;\n\tmargin-top: 20px;\n\tfont-size: calc(18 / 16 * 1rem);\n\n\ta {\n\t\tposition: relative;\n\t\tdisplay: inline-block;\n\n\t\t/* \n\t\t * 【ホバー時に伸びる下線の実装】\n\t\t * 1. ::after であらかじめ 0幅の「線」を要素の下に置いておきます。\n\t\t * 2. transform: scaleX(0) で、最初は横幅を 0 にして隠しておきます。\n\t\t */\n\t\t&::after {\n\t\t\tcontent: \"\";\n\t\t\tposition: absolute;\n\t\t\tleft: 0;\n\t\t\tbottom: 0;\n\t\t\twidth: 100%;\n\t\t\t/* 下線の太さ */\n\t\t\theight: 1px;\n\t\t\t/* テキストと同じ色（currentcolor）を自動で採用します */\n\t\t\tbackground-color: currentcolor;\n\t\t\ttransform: scaleX(0);\n\t\t\t/* transform-origin: bottom left で「左下」を起点に伸びるようにします */\n\t\t\ttransform-origin: bottom left;\n\t\t\ttransition: transform 0.3s ease-out;\n\t\t\t/* 0.3秒かけて滑らかに変化させます */\n\t\t}\n\n\t\t/* ホバー時に scaleX(1) に戻すことで、線が左から右に伸びて表示されます */\n\t\t&:hover::after {\n\t\t\ttransform: scaleX(1);\n\t\t}\n\t}\n\n\t@media (width >= 769px) {\n\t\tflex-direction: row;\n\t\tgap: 0 30px;\n\t\tmargin-top: 0;\n\t}\n}\n\n.footer-copyright {\n\tmargin-top: 40px;\n\n\tsmall {\n\t\tfont-size: calc(12 / 16 * 1rem);\n\t}\n\n\t@media (width >= 769px) {\n\t\tmargin-top: 60px;\n\t}\n}"},"js":{"name":"main.js","lang":"js","src":"// ハンバーガーメニューの開閉\nconst menuButton = document.querySelector('.sp-menu');\nconst headerNav = document.querySelector('.header-nav');\nconst header = document.querySelector('.header');\n\n// ★参考: 画面サイズに応じてaria-hiddenを制御\n// アクセシビリティ向上のための機能ですが、参考程度でOKです\nfunction updateAriaHidden() {\n\tconst isDesktop = window.matchMedia('(min-width: 769px)').matches;\n\n\tif (isDesktop) {\n\t\t// PC表示では常に表示されているのでaria-hiddenを削除\n\t\theaderNav.removeAttribute('aria-hidden');\n\t} else {\n\t\t// SP表示ではメニューの状態に応じて設定\n\t\tconst isActive = headerNav.classList.contains('active');\n\t\theaderNav.setAttribute('aria-hidden', !isActive);\n\t}\n}\n\n// ★参考: 上記のaria-hidden制御を初期化時とリサイズ時に実行（参考程度でOK）\nupdateAriaHidden();\nwindow.addEventListener('resize', updateAriaHidden);\n\nmenuButton.addEventListener('click', () => {\n\t// メニューボタンに active クラスをトグル\n\tmenuButton.classList.toggle('active');\n\n\t// ナビゲーションの表示切り替え\n\theaderNav.classList.toggle('active');\n\n\t// ★参考: aria属性の更新（アクセシビリティ向上のため、参考程度でOK）\n\tconst isExpanded = menuButton.getAttribute('aria-expanded') === 'true';\n\tmenuButton.setAttribute('aria-expanded', !isExpanded);\n\n\t// ★参考: SP表示の場合のみaria-hiddenを更新\n\tconst isDesktop = window.matchMedia('(min-width: 769px)').matches;\n\tif (!isDesktop) {\n\t\theaderNav.setAttribute('aria-hidden', isExpanded);\n\t}\n});\n\n// メニューの外側をクリックしたときに閉じる\ndocument.addEventListener('click', (e) => {\n\t// メニューが開いている場合のみ処理\n\tif (!headerNav.classList.contains('active')) return;\n\n\t// クリックされた要素がメニューボタンまたはナビゲーション内でない場合\n\tif (!menuButton.contains(e.target) && !headerNav.contains(e.target)) {\n\t\tmenuButton.classList.remove('active');\n\t\theaderNav.classList.remove('active');\n\t\t// ★参考: aria属性の更新（参考程度でOK）\n\t\tmenuButton.setAttribute('aria-expanded', 'false');\n\n\t\t// ★参考: SP表示の場合のみaria-hiddenを更新\n\t\tconst isDesktop = window.matchMedia('(min-width: 769px)').matches;\n\t\tif (!isDesktop) {\n\t\t\theaderNav.setAttribute('aria-hidden', 'true');\n\t\t}\n\t}\n});\n\n// スクロール時にヘッダーに影を追加\nfunction updateHeaderShadow() {\n\tif (window.scrollY > 0) {\n\t\theader.classList.add('scrolled');\n\t} else {\n\t\theader.classList.remove('scrolled');\n\t}\n}\n\n// 初期化時とスクロール時に実行\nupdateHeaderShadow();\nwindow.addEventListener('scroll', updateHeaderShadow);\n\n// スムーススクロール\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(anchor => {\n\tanchor.addEventListener('click', function (e) {\n\t\tconst href = this.getAttribute('href');\n\n\t\t// #のみの場合は処理しない\n\t\tif (href === '#') return;\n\n\t\te.preventDefault();\n\n\t\tconst targetId = href.substring(1);\n\t\tconst targetElement = document.getElementById(targetId);\n\n\t\tif (targetElement) {\n\t\t\t// ヘッダーの高さを取得\n\t\t\tconst headerHeight = header.offsetHeight;\n\n\t\t\t// ターゲット要素の位置を取得\n\t\t\tconst targetPosition = targetElement.getBoundingClientRect().top + window.scrollY;\n\n\t\t\t// ヘッダーの高さ分オフセット\n\t\t\tconst offsetPosition = targetPosition - headerHeight;\n\n\t\t\t// スムーススクロール\n\t\t\twindow.scrollTo({\n\t\t\t\ttop: offsetPosition,\n\t\t\t\tbehavior: 'smooth'\n\t\t\t});\n\n\t\t\t// SPメニューが開いている場合は閉じる\n\t\t\tif (headerNav.classList.contains('active')) {\n\t\t\t\tmenuButton.classList.remove('active');\n\t\t\t\theaderNav.classList.remove('active');\n\t\t\t\t// ★参考: aria属性の更新（参考程度でOK）\n\t\t\t\tmenuButton.setAttribute('aria-expanded', 'false');\n\t\t\t\theaderNav.setAttribute('aria-hidden', 'true');\n\t\t\t}\n\t\t}\n\t});\n});\n"}},"topics":[{"id":"viewport","cat":"HTML","title":"viewport の指定（レスポンシブの大前提）","body":"\u003cp>スマホのブラウザは、何も指定しないと「PC用の広い画面（約980px）」としてページを描画し、それを縮小して表示します。これではメディアクエリが正しく働きません。\u003c/p>\n\u003cp>\u003ccode>width=device-width\u003c/code> で「端末の実際の幅をそのまま画面幅として使う」、\u003ccode>initial-scale=1.0\u003c/code> で「最初は等倍で表示する」と伝えています。レスポンシブ対応のサイトでは必ず書く1行です。\u003c/p>","lecture":"","links":[["MDN: ビューポート meta 要素","https://developer.mozilla.org/ja/docs/Web/HTML/Viewport_meta_tag"]],"spots":[{"file":"html","start":6,"end":6,"note":"","ref":false}]},{"id":"css-order","cat":"HTML","title":"CSSを読み込む順番","body":"\u003cp>CSSは\u003cstrong>後から読み込んだものが優先\u003c/strong>されます（詳細度が同じ場合）。\u003c/p>\n\u003cp>そのため、ブラウザごとの差をなくすリセットCSS（\u003ccode>destyle.css\u003c/code>）を先に、自分で書く \u003ccode>style.css\u003c/code> を\u003cstrong>いちばん最後\u003c/strong>に読み込みます。順番が逆だと、せっかく書いたスタイルがリセットCSSに上書きされてしまいます。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>ライブラリ（スライダーなど）のCSSを使う場合も同じ考え方です。「上書きしたい側を後ろに」と覚えましょう。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: カスケードと継承","https://developer.mozilla.org/ja/docs/Web/CSS/Cascade"]],"spots":[{"file":"html","start":12,"end":14,"note":"","ref":false}]},{"id":"script-defer","cat":"HTML","title":"&lt;script&gt; の読み込み位置と defer 属性","body":"\u003cp>以前は \u003ccode>&lt;/body&gt;\u003c/code> の直前に書くことが多かった \u003ccode>&lt;script&gt;\u003c/code> ですが、現在は \u003ccode>&lt;head&gt;\u003c/code> 内に \u003ccode>defer\u003c/code> 属性をつけて書くのが主流です。\u003c/p>\n\u003cul>\n\u003cli>HTMLの解析を止めずに、JSファイルを裏側で読み込みます\u003c/li>\n\u003cli>HTMLの解析が\u003cstrong>終わってから\u003c/strong>実行されます\u003c/li>\n\u003cli>複数ある場合は、書いた順に実行されます\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>main.js\u003c/code> は \u003ccode>.sp-menu\u003c/code> などのHTML要素を取得して操作します。要素がまだ存在しないタイミングで実行されるとエラーになるので、「HTMLを読み終えてから実行」を保証してくれる \u003ccode>defer\u003c/code> が必要です。\u003c/p>","lecture":"script-defer","links":[["MDN: \u003cscript> の defer 属性","https://developer.mozilla.org/ja/docs/Web/HTML/Element/script#defer"]],"spots":[{"file":"html","start":15,"end":15,"note":"","ref":false},{"file":"js","start":1,"end":4,"note":"HTMLの要素を取得している＝HTMLの解析後に実行する必要がある","ref":true}]},{"id":"paths","cat":"HTML","title":"ロゴのリンクとパスの書き方","body":"\u003cp>ロゴはトップページへのリンクにするのが定番です。リンク先の書き方には種類があります。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>index.html\u003c/code> / \u003ccode>./\u003c/code> … \u003cstrong>相対パス\u003c/strong>。今いるファイルの場所を基準にします。自分のPCでファイルを直接開いても動きます。\u003c/li>\n\u003cli>\u003ccode>/\u003c/code> … \u003cstrong>ルート相対パス\u003c/strong>。サイトの一番上の階層を基準にします。サーバーにアップした後に使えます。\u003c/li>\n\u003c/ul>\n\u003cp>なお、このサイトはトップページなので、ロゴを \u003ccode>&lt;h1&gt;\u003c/code> にしています（ページの主題＝サイト名）。\u003c/p>","lecture":"","links":[["MDN: URLとパスの基本","https://developer.mozilla.org/ja/docs/Learn/HTML/Introduction_to_HTML/Creating_hyperlinks"]],"spots":[{"file":"html","start":22,"end":25,"note":"","ref":false}]},{"id":"hamburger-menu","cat":"HTML","title":"ハンバーガーメニューは button で作る","body":"\u003cp>ハンバーガーメニューには \u003ccode>div\u003c/code> や \u003ccode>a\u003c/code> ではなく \u003ccode>&lt;button&gt;\u003c/code> を使います。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>なぜ button？\u003c/strong> … これは「別のページへ移動するリンク」ではなく「メニューを開閉するスイッチ」だからです。\u003ccode>button\u003c/code> なら、Tabキーで選択・Enterキーで実行といったキーボード操作が最初から使えます。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>aria-label=\"メニュー\"\u003c/code>\u003c/strong> … 中身が3本線（空の \u003ccode>span\u003c/code>）だけだと、音声読み上げでは何のボタンか伝わりません。ラベルで「メニュー」と名前をつけています。\u003c/li>\n\u003cli>\u003cstrong>3つの \u003ccode>span\u003c/code>\u003c/strong> … これがCSSで3本線になり、開いたときに×印に変形します。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>aria-controls\u003c/code>（どの要素を操作するか）・\u003ccode>aria-expanded\u003c/code>（開いているか）・\u003ccode>aria-hidden\u003c/code>（隠れているか）は、支援技術に開閉状態を伝えるための属性です。JavaScriptで値を書き換えていますが、今は「アクセシビリティのための記述」という理解で十分です。\u003c/p>\u003c/div>\n\u003cp>PC幅（769px以上）ではメニューが最初から横並びで見えているので、ボタン自体を \u003ccode>display: none\u003c/code> で消しています。\u003c/p>","lecture":"hamburger-menu","links":[["MDN: \u003cbutton>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/button"],["MDN: aria-label 属性","https://developer.mozilla.org/ja/docs/Web/Accessibility/ARIA/Attributes/aria-label"]],"spots":[{"file":"html","start":27,"end":31,"note":"ボタン本体と3本線","ref":false},{"file":"html","start":32,"end":32,"note":"ボタンが開閉する対象","ref":false},{"file":"css","start":163,"end":166,"note":"PCではボタンを非表示","ref":false},{"file":"js","start":25,"end":30,"note":"クリックで開閉","ref":true}]},{"id":"anchor-links","cat":"HTML","title":"ページ内リンク（アンカーリンク）","body":"\u003cp>メニューをクリックすると、同じページ内の各セクションへジャンプします。これには\u003cstrong>リンク元とリンク先の両方\u003c/strong>の設定が必要です。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>リンク元\u003c/strong>：\u003ccode>href\u003c/code> に \u003ccode>#\u003c/code> ＋ id名 を書く（\u003ccode>href=\"#pick-up\"\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>リンク先\u003c/strong>：ジャンプ先の要素に \u003ccode>id\u003c/code> をつける（\u003ccode>id=\"pick-up\"\u003c/code>）\u003c/li>\n\u003c/ol>\n\u003cp>左のコードで強調されている場所を見比べて、\u003ccode>#\u003c/code> の後ろと \u003ccode>id\u003c/code> が一致していることを確認しましょう。\u003c/p>\n\u003cdiv class=\"note\">\n\u003cul>\n\u003cli>\u003ccode>id\u003c/code> は同じページ内で1回しか使えません\u003c/li>\n\u003cli>大文字・小文字は区別されます\u003c/li>\n\u003cli>\u003ccode>href\u003c/code> 側には必ず \u003ccode>#\u003c/code> をつけます\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cp>このサイトではさらに、JavaScriptで「なめらかにスクロール」「固定ヘッダーの高さ分だけ位置をずらす」処理を足しています。\u003c/p>","lecture":"anchor-links","links":[["MDN: id 属性","https://developer.mozilla.org/ja/docs/Web/HTML/Global_attributes/id"]],"spots":[{"file":"html","start":33,"end":37,"note":"リンク元（ヘッダー）","ref":false},{"file":"html","start":61,"end":61,"note":"リンク先","ref":false},{"file":"html","start":108,"end":108,"note":"リンク先","ref":false},{"file":"html","start":124,"end":124,"note":"リンク先","ref":false},{"file":"html","start":154,"end":158,"note":"リンク元（フッター）","ref":false}]},{"id":"picture-element","cat":"HTML","title":"画像の出し分け（&lt;picture&gt; 要素）","body":"\u003cp>メインビジュアルは、スマホ用（縦長）とPC用（横長）で\u003cstrong>別の画像\u003c/strong>を表示しています。CSSの \u003ccode>display: none\u003c/code> で隠すのではなく、\u003ccode>&lt;picture&gt;\u003c/code> でブラウザに適切な画像を選ばせています。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>&lt;source media=\"(min-width: 768px)\"&gt;\u003c/code> … 条件に合えばこの画像を使う\u003c/li>\n\u003cli>\u003ccode>&lt;img&gt;\u003c/code> … どの条件にも合わなかったときの画像（＝スマホ用）。\u003ccode>alt\u003c/code> もここに書きます\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>メリット\u003c/strong>：画面に合った構図の画像を出せる（アートディレクション）うえに、スマホのユーザーにPC用の大きな画像をダウンロードさせずに済みます。CSSで隠すだけだと、両方の画像が読み込まれてしまいます。\u003c/p>\n\u003cp>CSS側では \u003ccode>width: 100%\u003c/code> で、画面幅いっぱいに画像を広げています。\u003c/p>","lecture":"picture-element","links":[["MDN: \u003cpicture>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/picture"],["ICS MEDIA: レスポンシブイメージで画像表示を最適化","https://ics.media/entry/13324/"]],"spots":[{"file":"html","start":43,"end":46,"note":"","ref":false},{"file":"css","start":288,"end":293,"note":"画像を幅いっぱいに","ref":false}]},{"id":"section-heading","cat":"HTML","title":"&lt;section&gt; には見出しを入れる","body":"\u003cp>\u003ccode>&lt;section&gt;\u003c/code> は文書の「章」や「節」を表す要素です。そのため、基本的に中身を表す\u003cstrong>見出し（h2 など）とセット\u003c/strong>で使います。\u003c/p>\n\u003cp>このサイトでは、キャッチコピー・Pick Up・Information・News のすべての \u003ccode>section\u003c/code> に \u003ccode>h2\u003c/code> が入っています。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>「ここを囲って背景色をつけたい」というデザイン上の理由だけで、見出しのない範囲に \u003ccode>section\u003c/code> を使うのはおすすめできません。その場合は意味を持たない \u003ccode>div\u003c/code> を使います。\u003c/p>\u003c/div>","lecture":"section-heading","links":[["MDN: \u003csection>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/section"],["MDN: 見出し要素（h1〜h6）","https://developer.mozilla.org/ja/docs/Web/HTML/Element/Heading_Elements"]],"spots":[{"file":"html","start":48,"end":52,"note":"","ref":false}]},{"id":"card-layout","cat":"HTML","title":"リストにする？ div にする？（Pick Up と News）","body":"\u003cp>Pick Up も News も「同じ形のものが並ぶ」デザインですが、タグを使い分けています。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>News（お知らせ）→ \u003ccode>ul &gt; li\u003c/code>\u003c/strong>\u003cbr>お知らせは情報を並べた「一覧」なので、リスト構造が合っています。\u003c/li>\n\u003cli>\u003cstrong>Pick Up（商品紹介）→ \u003ccode>div\u003c/code>\u003c/strong>\u003cbr>商品一つひとつに見出し（\u003ccode>h3\u003c/code>）があります。\u003ccode>li\u003c/code> の中に見出しを入れるのは文法的には間違いではありませんが、見出しは新しいセクションの始まりを意味するため、リストの意味がうまく伝わらない可能性があります。それぞれが見出しを持つ独立したコンテンツなので、\u003ccode>div\u003c/code> でまとめています。\u003c/li>\n\u003c/ul>\n\u003cp>「見た目が似ている＝同じタグ」ではなく、\u003cstrong>中身の意味\u003c/strong>でタグを選ぶのがポイントです。\u003c/p>","lecture":"card-layout","links":[["MDN: \u003cli>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/li"],["HTML Standard: li 要素","https://html.spec.whatwg.org/#the-li-element"]],"spots":[{"file":"html","start":64,"end":65,"note":"Pick Up は div","ref":false},{"file":"html","start":67,"end":67,"note":"カードごとに見出しがある","ref":false},{"file":"html","start":127,"end":127,"note":"News は ul > li","ref":false}]},{"id":"time-element","cat":"HTML","title":"日付は &lt;time&gt; 要素で","body":"\u003cp>日付や時刻には \u003ccode>&lt;time&gt;\u003c/code> 要素を使います。\u003c/p>\n\u003cp>画面には「2026.01.15」と見やすい形で表示しつつ、\u003ccode>datetime=\"2026-01-15\"\u003c/code> で\u003cstrong>機械が読める正式な形式\u003c/strong>の日付を伝えています。検索エンジンやブラウザ、支援技術が「これは日付だ」と正しく理解できます。\u003c/p>","lecture":"","links":[["MDN: \u003ctime>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/time"]],"spots":[{"file":"html","start":129,"end":129,"note":"","ref":false}]},{"id":"footer-nav","cat":"HTML","title":"フッターのリンク集に nav を使っていない理由","body":"\u003cp>ヘッダーのメニューは \u003ccode>&lt;nav&gt;\u003c/code> ですが、フッターのリンク集は \u003ccode>div\u003c/code> と \u003ccode>ul\u003c/code> だけで作っています。\u003c/p>\n\u003cp>\u003ccode>nav\u003c/code> は「\u003cstrong>主要な\u003c/strong>ナビゲーション」を表す要素です。ページ内に \u003ccode>nav\u003c/code> がいくつもあると、スクリーンリーダーの利用者が「メインのメニュー」にたどり着きにくくなることがあります。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>フッターにも \u003ccode>nav\u003c/code> を使う場合は、\u003ccode>aria-label\u003c/code> や \u003ccode>aria-labelledby\u003c/code> で「これはフッターのナビです」と区別できるようにするのがおすすめです。\u003c/p>\u003c/div>","lecture":"footer-nav","links":[["MDN: \u003cnav>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/nav"]],"spots":[{"file":"html","start":150,"end":159,"note":"","ref":false}]},{"id":"small-element","cat":"HTML","title":"&lt;small&gt; の本来の意味","body":"\u003cp>\u003ccode>&lt;small&gt;\u003c/code> は「文字を小さくするタグ」ではありません。\u003cstrong>著作権表示・免責事項・注意書き\u003c/strong>などの「注釈」を表す要素です。コピーライト表記にはぴったりです。\u003c/p>\n\u003cp>実際の文字サイズはCSS側で指定しています（\u003ccode>12px\u003c/code> を rem に変換）。「意味はHTML、見た目はCSS」という役割分担です。\u003c/p>","lecture":"small-element","links":[["MDN: \u003csmall>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/small"]],"spots":[{"file":"html","start":160,"end":162,"note":"","ref":false},{"file":"css","start":632,"end":642,"note":"文字サイズはCSSで指定","ref":false}]},{"id":"img-fluid","cat":"CSS","title":"画像を親要素からはみ出させない","body":"\u003cp>画像は何も指定しないと「元の画像サイズ」のまま表示されるので、スマホでは画面からはみ出してしまいます。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>max-width: 100%\u003c/code> … 親要素の幅より大きくならない（小さい画像は元のサイズのまま）\u003c/li>\n\u003cli>\u003ccode>height: auto\u003c/code> … 幅が縮んだとき、縦横比を保ったまま高さも縮む\u003c/li>\n\u003c/ul>\n\u003cp>全ページ共通で効かせたいので、ファイルの最初に書いています。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003cstrong>\u003ccode>max-width: 100%\u003c/code> と \u003ccode>width: 100%\u003c/code> の違い\u003c/strong>\u003cbr>\u003ccode>width: 100%\u003c/code> は、画像が小さくても親の幅まで\u003cstrong>引き伸ばします\u003c/strong>。カードの画像のように「必ず幅いっぱいに」したい場所では \u003ccode>width: 100%\u003c/code> を使います。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: max-width","https://developer.mozilla.org/ja/docs/Web/CSS/max-width"]],"spots":[{"file":"css","start":7,"end":11,"note":"全画像の基本設定","ref":false},{"file":"css","start":361,"end":369,"note":"カード画像は width: 100%","ref":false}]},{"id":"css-variables","cat":"CSS","title":"CSS変数（カスタムプロパティ）","body":"\u003cp>サイト内で何度も使う色を「変数」として名前をつけて登録しています。\u003ccode>:root\u003c/code>（文書のいちばん根元）で定義すると、サイト全体から使えます。\u003c/p>\n\u003cpre data-lang=\"css\">:root {\n\t--main: #4C310D;      /* 定義：-- から始まる名前 */\n}\n.section-title {\n\tcolor: var(--main);   /* 使用：var() で呼び出す */\n}\u003c/pre>\n\u003cp>\u003cstrong>メリット\u003c/strong>：「メインカラーを少し変えたい」となったとき、\u003ccode>:root\u003c/code> の1か所を書き換えるだけで、使っている場所すべてに反映されます。カラーコードを探して1つずつ直す必要がありません。\u003c/p>\n\u003cp>\u003ccode>--main\u003c/code> という名前から「これはメインカラーだ」と意図が読み取れるのも利点です。\u003c/p>","lecture":"css-variables","links":[["MDN: CSS カスタムプロパティ（変数）の使用","https://developer.mozilla.org/ja/docs/Web/CSS/Using_CSS_custom_properties"],["MDN: var()","https://developer.mozilla.org/ja/docs/Web/CSS/var"]],"spots":[{"file":"css","start":13,"end":25,"note":"変数の定義","ref":false},{"file":"css","start":41,"end":42,"note":"変数を使う","ref":false}]},{"id":"overflow-sticky","cat":"CSS","title":"overflow-x: clip と sticky の関係","body":"\u003cp>意図しない横スクロール（横揺れ）を防ぐための保険です。\u003c/p>\n\u003cp>以前は \u003ccode>overflow-x: hidden\u003c/code> がよく使われましたが、これを \u003ccode>html\u003c/code> や \u003ccode>body\u003c/code> に指定すると、\u003cstrong>中にある \u003ccode>position: sticky\u003c/code> が効かなくなる\u003c/strong>ことがあります。\u003ccode>hidden\u003c/code> は要素を「スクロールする箱」に変えてしまうためです。\u003c/p>\n\u003cp>\u003ccode>overflow-x: clip\u003c/code> は、スクロールする箱にはせず、はみ出した部分を\u003cstrong>ただ切り取るだけ\u003c/strong>。このサイトのヘッダーは \u003ccode>sticky\u003c/code> で固定しているので、\u003ccode>clip\u003c/code> を使っています。\u003c/p>","lecture":"overflow-sticky","links":[["MDN: overflow","https://developer.mozilla.org/ja/docs/Web/CSS/overflow"]],"spots":[{"file":"css","start":27,"end":34,"note":"","ref":false},{"file":"css","start":43,"end":43,"note":"body にも指定","ref":false},{"file":"css","start":54,"end":61,"note":"clip のおかげで効く sticky","ref":true}]},{"id":"flexbox-basics","cat":"CSS","title":"Flexbox の基礎","body":"\u003cp>親要素に \u003ccode>display: flex\u003c/code> を指定すると、\u003cstrong>子要素\u003c/strong>が横並びになり、並べ方を細かく指定できます。このサイトでもあちこちで使っています。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>justify-content\u003c/code> … 主軸方向（横並びなら左右）の配置。\u003ccode>center\u003c/code>＝中央、\u003ccode>space-between\u003c/code>＝両端にそろえる\u003c/li>\n\u003cli>\u003ccode>align-items\u003c/code> … 交差軸方向（横並びなら上下）の配置。\u003ccode>center\u003c/code>＝上下中央\u003c/li>\n\u003cli>\u003ccode>flex-direction\u003c/code> … 並べる向き。\u003ccode>row\u003c/code>＝横（初期値）、\u003ccode>column\u003c/code>＝縦\u003c/li>\n\u003cli>\u003ccode>gap\u003c/code> / \u003ccode>column-gap\u003c/code> / \u003ccode>row-gap\u003c/code> … 子要素どうしの間隔\u003c/li>\n\u003c/ul>\n\u003cp>たとえば \u003ccode>.header-inner\u003c/code> は \u003ccode>space-between\u003c/code> で「ロゴは左端、メニューは右端」に分けています。\u003ccode>.news-contents\u003c/code> は \u003ccode>column\u003c/code> で縦に並べ、\u003ccode>row-gap\u003c/code> で記事の間隔をあけています（\u003ccode>margin\u003c/code> を1つずつ書かなくて済みます）。\u003c/p>","lecture":"flexbox-basics","links":[["MDN: CSS フレックスボックスレイアウト","https://developer.mozilla.org/ja/docs/Web/CSS/CSS_flexible_box_layout"],["Webクリエイターボックス: Flexbox チートシート","https://www.webcreatorbox.com/blog/css-flexbox-cheat-sheet"]],"spots":[{"file":"css","start":50,"end":53,"note":"中身を上下左右中央に","ref":false},{"file":"css","start":79,"end":85,"note":"ロゴとメニューを両端に","ref":false},{"file":"css","start":213,"end":214,"note":"PCのメニューを横並びに","ref":false},{"file":"css","start":389,"end":393,"note":"ボタンの文字と矢印を中央に","ref":false},{"file":"css","start":498,"end":500,"note":"縦並び＋間隔","ref":false},{"file":"css","start":573,"end":580,"note":"PCでロゴとメニューを両端に","ref":false}]},{"id":"position-sticky","cat":"CSS","title":"position: sticky でヘッダーを固定","body":"\u003cp>スクロールしてもヘッダーが画面の上に残り続けるのは \u003ccode>position: sticky\u003c/code> のおかげです。\u003c/p>\n\u003cul>\n\u003cli>ふだんは普通の位置に配置される\u003c/li>\n\u003cli>スクロールして指定の位置（\u003ccode>top: 0\u003c/code>＝画面の上端）に来ると、そこに貼り付く\u003c/li>\n\u003cli>\u003ccode>top\u003c/code> などの位置指定と\u003cstrong>セットで使う\u003c/strong>（ないと動きません）\u003c/li>\n\u003c/ul>\n\u003ch3>z-index（重なり順）\u003c/h3>\n\u003cp>数値が大きいほど手前に表示されます。ヘッダーがメインコンテンツの上に重なるよう \u003ccode>2\u003c/code> を指定しています。スマホのスライドメニューはさらに手前に出したいので \u003ccode>10\u003c/code> です。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>position: fixed\u003c/code> との違い：\u003ccode>fixed\u003c/code> は要素が「浮いて」しまい、下のコンテンツがヘッダーの裏に潜り込みます。\u003ccode>sticky\u003c/code> は元の場所を確保したまま固定されるので、余白の調整が不要です。\u003c/p>\u003c/div>","lecture":"position-sticky","links":[["MDN: position","https://developer.mozilla.org/ja/docs/Web/CSS/position"],["MDN: z-index","https://developer.mozilla.org/ja/docs/Web/CSS/z-index"],["ICS MEDIA: z-indexとスタッキングコンテキストの関係","https://ics.media/entry/200609/"]],"spots":[{"file":"css","start":54,"end":61,"note":"ヘッダーの固定","ref":false},{"file":"css","start":185,"end":185,"note":"スライドメニューはさらに手前","ref":false}]},{"id":"transition","cat":"CSS","title":"transition でなめらかに変化させる","body":"\u003cp>\u003ccode>transition\u003c/code> を指定すると、プロパティの値が変わるとき、パッと切り替わるのではなく\u003cstrong>時間をかけてなめらかに\u003c/strong>変化します。\u003c/p>\n\u003cpre data-lang=\"css\">transition: 対象のプロパティ  時間  変化のしかた;\ntransition: opacity 0.3s ease;\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>対象\u003c/strong> … \u003ccode>opacity\u003c/code> や \u003ccode>transform\u003c/code> など。\u003ccode>all\u003c/code> にすると変化するすべてが対象\u003c/li>\n\u003cli>\u003cstrong>時間\u003c/strong> … \u003ccode>0.3s\u003c/code>＝0.3秒\u003c/li>\n\u003cli>\u003cstrong>変化のしかた\u003c/strong> … \u003ccode>ease\u003c/code>、\u003ccode>ease-in-out\u003c/code>、\u003ccode>ease-out\u003c/code> など（加速・減速のぐあい）\u003c/li>\n\u003c/ul>\n\u003cp>このサイトでは、ヘッダーの影／ハンバーガーの3本線／スライドメニューの出入り／ボタンのホバー／フッターの下線で使っています。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003cstrong>書く場所に注意\u003c/strong>：\u003ccode>transition\u003c/code> は \u003ccode>:hover\u003c/code> の中ではなく、\u003cstrong>変化する前の（ふだんの）状態\u003c/strong>に書きます。そうすると、戻るときもなめらかになります。\u003c/p>\u003c/div>","lecture":"transition","links":[["MDN: transition","https://developer.mozilla.org/ja/docs/Web/CSS/transition"],["MDN: イージング関数","https://developer.mozilla.org/ja/docs/Web/CSS/easing-function"]],"spots":[{"file":"css","start":64,"end":66,"note":"ヘッダーの影","ref":false},{"file":"css","start":112,"end":113,"note":"ハンバーガーの3本線","ref":false},{"file":"css","start":188,"end":189,"note":"スライドメニュー","ref":false},{"file":"css","start":404,"end":409,"note":"ボタンのホバー","ref":false},{"file":"css","start":615,"end":616,"note":"フッターの下線","ref":false}]},{"id":"media-query-range","cat":"CSS","title":"メディアクエリの新しい書き方（スマホファースト）","body":"\u003cp>「画面幅が769px以上のとき」だけ適用するスタイルを書いています。\u003c/p>\n\u003cpre data-lang=\"css\">/* 新しい書き方（範囲構文） */\n@media (width &gt;= 769px) { ... }\n\n/* 従来の書き方（意味は同じ） */\n@media (min-width: 769px) { ... }\u003c/pre>\n\u003cp>数学の不等号（\u003ccode>&gt;=\u003c/code>、\u003ccode>&lt;\u003c/code>）でそのまま書けるので、「以上・以下・未満」を迷わず読めます。\u003c/p>\n\u003ch3>スマホファースト\u003c/h3>\n\u003cp>このCSSは、\u003cstrong>まずスマホ用のスタイルを書き、PC用の違いだけをメディアクエリで上書き\u003c/strong>する書き方（スマホファースト）です。さらに、CSSのネストを使って「そのセレクタの中」にメディアクエリを書いているので、スマホ用とPC用のスタイルが近くにまとまって読みやすくなっています。\u003c/p>","lecture":"media-query-range","links":[["MDN: メディアクエリの使用","https://developer.mozilla.org/ja/docs/Web/CSS/CSS_media_queries/Using_media_queries"],["MDN: @media 範囲構文","https://developer.mozilla.org/ja/docs/Web/CSS/@media"]],"spots":[{"file":"css","start":68,"end":71,"note":".header の中に書いたメディアクエリ","ref":false},{"file":"css","start":250,"end":259,"note":"スマホ60px → PC80px","ref":true}]},{"id":"css-nesting","cat":"CSS","title":"CSSのネスト（入れ子）","body":"\u003cp>これまで Sass などが必要だった「入れ子」の書き方が、ふつうのCSSで使えるようになりました。親のセレクタを何度も書かずに済み、関係するスタイルがひとまとまりになります。\u003c/p>\n\u003cpre data-lang=\"css\">.sp-menu {\n\twidth: 30px;\n\n\tspan { ... }          /* → .sp-menu span */\n\t&amp;.active span { ... } /* → .sp-menu.active span */\n\t@media (width &gt;= 769px) { ... } /* → 769px以上のときの .sp-menu */\n}\u003c/pre>\n\u003ch3>&amp; が必要なとき\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>子孫セレクタ\u003c/strong>（\u003ccode>.sp-menu span\u003c/code>）… そのまま入れ子にするだけでOK\u003c/li>\n\u003cli>\u003cstrong>親自身につなげる\u003c/strong>とき … \u003ccode>&amp;\u003c/code> が必要。\u003ccode>&amp;:hover\u003c/code>（疑似クラス）、\u003ccode>&amp;::after\u003c/code>（疑似要素）、\u003ccode>&amp;.active\u003c/code>（クラスが付いたとき）\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cp>Sass の \u003ccode>&amp;__title\u003c/code> のような「文字列をつなげてクラス名を作る」書き方は、標準のCSSネストでは使えません。\u003c/p>\u003c/div>","lecture":"css-nesting","links":[["MDN: CSS の入れ子","https://developer.mozilla.org/ja/docs/Web/CSS/CSS_nesting"]],"spots":[{"file":"css","start":104,"end":118,"note":"子孫セレクタ：.sp-menu span","ref":false},{"file":"css","start":219,"end":237,"note":"3段の入れ子（li → a → @media）","ref":false},{"file":"css","start":485,"end":487,"note":"News の中だけ見出しを白に","ref":false},{"file":"css","start":407,"end":409,"note":"& を使う例（:hover）","ref":true}]},{"id":"abs-position","cat":"CSS","title":"position: relative と absolute（3本線の配置）","body":"\u003cp>ハンバーガーボタンの3本線は、\u003ccode>position: absolute\u003c/code> で\u003cstrong>ボタンの中の好きな位置\u003c/strong>に置いています。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>親（\u003ccode>.sp-menu\u003c/code>）に \u003ccode>position: relative\u003c/code>\u003c/strong> … 「ここを基準にしてね」という目印\u003c/li>\n\u003cli>\u003cstrong>子（\u003ccode>span\u003c/code>）に \u003ccode>position: absolute\u003c/code>\u003c/strong> … 基準からの距離を \u003ccode>top\u003c/code> / \u003ccode>left\u003c/code> / \u003ccode>bottom\u003c/code> で指定\u003c/li>\n\u003c/ul>\n\u003cp>親に \u003ccode>relative\u003c/code> を書き忘れると、線はページ全体など別の要素を基準に配置されてしまいます。\u003cstrong>relative と absolute はセット\u003c/strong>で覚えましょう。\u003c/p>\n\u003cp>\u003ccode>left: 5px\u003c/code> は「ボタン幅30px − 線の幅20px ＝ 余り10px。その半分の5px」で、左右中央になる計算です。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>span\u003c/code> はインライン要素なので、本来 \u003ccode>width\u003c/code> や \u003ccode>height\u003c/code> が効きません。\u003ccode>position: absolute\u003c/code> を指定するとブロックのように扱われ、サイズを指定できるようになります。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: position","https://developer.mozilla.org/ja/docs/Web/CSS/position"]],"spots":[{"file":"css","start":95,"end":102,"note":"親：基準点（relative）","ref":false},{"file":"css","start":114,"end":117,"note":"子：自由に配置（absolute）","ref":false},{"file":"html","start":27,"end":31,"note":"HTMLの構造","ref":true}]},{"id":"nth-child","cat":"CSS","title":":nth-child() で「何番目」を指定する","body":"\u003cp>\u003ccode>:nth-child(n)\u003c/code> は、親要素の中で\u003cstrong>何番目の子か\u003c/strong>を指定してスタイルを当てる疑似クラスです。3本の \u003ccode>span\u003c/code> にクラス名をつけなくても、1本目・2本目・3本目を区別できます。\u003c/p>\n\u003cpre data-lang=\"css\">li:nth-child(3)    { ... } /* 3番目 */\nli:nth-child(even) { ... } /* 偶数番目 */\nli:nth-child(odd)  { ... } /* 奇数番目 */\nli:nth-child(3n)   { ... } /* 3の倍数番目 */\u003c/pre>\n\u003cdiv class=\"note\">\n\u003cp>\u003cstrong>注意\u003c/strong>：\u003ccode>span:nth-child(2)\u003c/code> は「2番目の span」ではなく「\u003cstrong>2番目の子で、かつ span\u003c/strong>」という意味です。間に別のタグが混ざると、思った要素に当たりません。\u003c/p>\n\u003cp>「span だけを数えて2番目」と書きたいときは、新しい \u003ccode>:nth-child(2 of span)\u003c/code> という書き方が使えます。\u003c/p>\n\u003c/div>","lecture":"nth-child","links":[["MDN: :nth-child()","https://developer.mozilla.org/ja/docs/Web/CSS/:nth-child"],["Qiita: 何番目系の便利なCSSまとめ","https://qiita.com/ituki_b/items/62a752389385de7ba4a2"]],"spots":[{"file":"css","start":120,"end":138,"note":"","ref":false},{"file":"html","start":27,"end":31,"note":"3つの span","ref":true}]},{"id":"transform-center","cat":"CSS","title":"top: 50% ＋ translateY(-50%) で上下中央","body":"\u003cp>真ん中の線を、ボタンのちょうど上下中央に置くための定番テクニックです。\u003c/p>\n\u003cp>\u003ccode>top: 50%\u003c/code> だけだと、要素の\u003cstrong>上端\u003c/strong>が中央に来るので、要素の高さ分だけ下にずれます。そこで \u003ccode>transform: translateY(-50%)\u003c/code> で「\u003cstrong>自分の高さの半分\u003c/strong>だけ上に戻す」と、要素の中心が親の中央にぴったり合います。\u003c/p>\n\u003cdiv class=\"demo\">\n\u003cdiv class=\"demo-center\">\n\u003cdiv>\u003cdiv class=\"stage\">\u003cdiv class=\"bar\">\u003c/div>\u003c/div>\u003cp>top: 50% だけ（下にずれる）\u003c/p>\u003c/div>\n\u003cdiv class=\"ok\">\u003cdiv class=\"stage\">\u003cdiv class=\"bar\">\u003c/div>\u003c/div>\u003cp>＋ translateY(-50%)（中央）\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp>\u003ccode>translate\u003c/code> の \u003ccode>%\u003c/code> は\u003cstrong>自分自身のサイズ\u003c/strong>が基準なので、要素の高さが変わっても必ず中央になります。左右も同じ考え方で、\u003ccode>left: 50%; transform: translateX(-50%);\u003c/code> です。\u003c/p>","lecture":"transform-center","links":[["MDN: transform","https://developer.mozilla.org/ja/docs/Web/CSS/transform"],["MDN: translateY()","https://developer.mozilla.org/ja/docs/Web/CSS/transform-function/translateY"]],"spots":[{"file":"css","start":126,"end":132,"note":"","ref":false}]},{"id":"hamburger-x","cat":"CSS","title":"3本線が×印に変わるしくみ","body":"\u003cp>ボタンに \u003ccode>.active\u003c/code> クラスが付いたときのスタイルです（クラスはJavaScriptが付け外しします）。\u003c/p>\n\u003cdiv class=\"demo\">\n\u003cp class=\"demo-cap\">▼ クリックしてみましょう\u003c/p>\n\u003cbutton type=\"button\" class=\"demo-burger\" data-demo-toggle aria-label=\"デモ用ボタン\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/button>\n\u003c/div>\n\u003col>\n\u003cli>\u003cstrong>1本目\u003c/strong>：\u003ccode>top: 50%\u003c/code> で中央へ移動し、\u003ccode>rotate(45deg)\u003c/code> で45度回転\u003c/li>\n\u003cli>\u003cstrong>2本目\u003c/strong>：\u003ccode>opacity: 0\u003c/code> で透明に\u003c/li>\n\u003cli>\u003cstrong>3本目\u003c/strong>：\u003ccode>bottom: 50%\u003c/code> で中央へ移動し、\u003ccode>rotate(-45deg)\u003c/code> で逆向きに回転\u003c/li>\n\u003c/ol>\n\u003cp>上下の線が中央で交差して「×」になります。\u003ccode>span\u003c/code> に \u003ccode>transition: all 0.3s\u003c/code> がかかっているので、位置・回転・透明度がすべてなめらかに変化します。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>transform\u003c/code> に複数の変形を書くときは、スペースで区切って並べます：\u003ccode>transform: translateY(-50%) rotate(45deg);\u003c/code>\u003c/p>\u003c/div>","lecture":"transition","links":[["MDN: rotate()","https://developer.mozilla.org/ja/docs/Web/CSS/transform-function/rotate"],["MDN: transition","https://developer.mozilla.org/ja/docs/Web/CSS/transition"]],"spots":[{"file":"css","start":140,"end":161,"note":".active のときの3本線","ref":false},{"file":"css","start":112,"end":113,"note":"なめらかに変化させる指定","ref":true},{"file":"js","start":25,"end":30,"note":".active を付け外しするJS","ref":true}]},{"id":"slide-menu","cat":"CSS","title":"スマホのスライドメニュー","body":"\u003cp>スマホでは、メニューを\u003cstrong>画面の左外に隠しておき\u003c/strong>、ボタンを押したら横からスライドして出てくるようにしています。\u003c/p>\n\u003col>\n\u003cli>\u003ccode>position: fixed\u003c/code> ＋ \u003ccode>top: 0; left: 0;\u003c/code> で、画面の左上に固定（スクロールしても動かない）\u003c/li>\n\u003cli>\u003ccode>width: 300px; height: 100vh;\u003c/code> で、幅300px・画面の高さいっぱいのパネルに\u003c/li>\n\u003cli>\u003ccode>transform: translateX(-120%)\u003c/code> で、自分の幅の120%ぶん左へ移動 ＝ \u003cstrong>画面の外に隠れる\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>.active\u003c/code> が付いたら \u003ccode>translateX(0)\u003c/code> ＝ \u003cstrong>元の位置（画面内）に戻る\u003c/strong>\u003c/li>\n\u003cli>\u003ccode>transition\u003c/code> で、その移動を0.3秒かけてなめらかに\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"note\">\u003cp>-100% ではなく -120% なのは、右側についている影（\u003ccode>box-shadow\u003c/code>）まで完全に画面の外へ出すためです。\u003c/p>\u003c/div>\n\u003cp>PC幅ではこの仕組みが不要なので、メディアクエリの中で1つずつ元に戻しています。\u003c/p>","lecture":"","links":[["MDN: translateX()","https://developer.mozilla.org/ja/docs/Web/CSS/transform-function/translateX"],["MDN: position","https://developer.mozilla.org/ja/docs/Web/CSS/position"]],"spots":[{"file":"css","start":170,"end":194,"note":"スマホ時のメニュー","ref":false},{"file":"css","start":196,"end":205,"note":"PCでは解除","ref":true},{"file":"html","start":32,"end":32,"note":"メニュー本体","ref":true},{"file":"js","start":25,"end":30,"note":".active を付け外しするJS","ref":true}]},{"id":"color-mix","cat":"CSS","title":"color-mix() で色を混ぜる","body":"\u003cp>\u003ccode>color-mix()\u003c/code> は、2つの色を指定した割合で混ぜる関数です。\u003c/p>\n\u003cpre data-lang=\"css\">/* 背景色95% ＋ 透明5% ＝ 少しだけ透ける背景色 */\nbackground-color: color-mix(in srgb, var(--bg) 95%, transparent);\n\n/* 背景色に黒を5%混ぜる ＝ 少しだけ暗い色 */\nborder-bottom: 1px solid color-mix(in srgb, var(--bg-secondary), var(--black) 5%);\u003c/pre>\n\u003cp>\u003cstrong>メリット\u003c/strong>：CSS変数の色をもとに「少し透明」「少し暗い」色を作れます。\u003ccode>rgba()\u003c/code> でカラーコードを打ち直す必要がなく、変数の色を変えれば自動で追従します。\u003c/p>\n\u003cp>\u003ccode>in srgb\u003c/code> は「どの色空間で混ぜるか」の指定です。まずは決まり文句として覚えてOKです。\u003c/p>","lecture":"color-mix","links":[["MDN: color-mix()","https://developer.mozilla.org/ja/docs/Web/CSS/color_value/color-mix"]],"spots":[{"file":"css","start":182,"end":183,"note":"少し透けるメニュー背景","ref":false},{"file":"css","start":220,"end":221,"note":"少し暗い区切り線","ref":false}]},{"id":"box-shadow","cat":"CSS","title":"box-shadow で影をつける","body":"\u003cp>カードやヘッダー、スライドメニューに影をつけて、立体感を出しています。\u003c/p>\n\u003cpre data-lang=\"css\">box-shadow: 横のずれ  縦のずれ  ぼかし  色;\nbox-shadow: 2px 2px 4px rgb(76 49 13 / 10%);\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>横のずれ\u003c/strong>：プラスで右へ\u003c/li>\n\u003cli>\u003cstrong>縦のずれ\u003c/strong>：プラスで下へ\u003c/li>\n\u003cli>\u003cstrong>ぼかし\u003c/strong>：大きいほどふんわり\u003c/li>\n\u003c/ul>\n\u003ch3>rgb( … / 10%) という書き方\u003c/h3>\n\u003cp>\u003ccode>rgb(76 49 13 / 10%)\u003c/code> は「メインカラー（#4C310D）の、不透明度10%」という意味です。スラッシュの後ろが透明度。真っ黒ではなくサイトの色に合わせた薄い影にすると、自然になじみます。\u003c/p>","lecture":"box-shadow","links":[["MDN: box-shadow","https://developer.mozilla.org/ja/docs/Web/CSS/box-shadow"],["MDN: rgb()","https://developer.mozilla.org/ja/docs/Web/CSS/color_value/rgb"]],"spots":[{"file":"css","start":356,"end":356,"note":"カードの影","ref":false},{"file":"css","start":75,"end":75,"note":"スクロール時のヘッダーの影（下方向）","ref":false},{"file":"css","start":184,"end":184,"note":"スライドメニューの影（右方向）","ref":false}]},{"id":"responsive-reset","cat":"CSS","title":"スマホ用のスタイルをPCで打ち消す","body":"\u003cp>スマホファーストで書くと、「スマホ用に指定したスタイルを、PCでは元に戻したい」場面が出てきます。そのときは、\u003cstrong>プロパティの初期値\u003c/strong>を指定して打ち消します。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>position: static\u003c/code> … position の初期値（ふつうの配置）\u003c/li>\n\u003cli>\u003ccode>width: auto\u003c/code> / \u003ccode>height: auto\u003c/code> … 中身や親に合わせた自然なサイズ\u003c/li>\n\u003cli>\u003ccode>background-color: transparent\u003c/code> … 背景なし\u003c/li>\n\u003cli>\u003ccode>box-shadow: none\u003c/code> / \u003ccode>transform: none\u003c/code> / \u003ccode>border-bottom: none\u003c/code> … なし\u003c/li>\n\u003cli>\u003ccode>z-index: auto\u003c/code> … 指定なし\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">\u003cp>「元に戻す値」はプロパティごとに違います。MDNの各プロパティのページにある「初期値」を確認する習慣をつけましょう。\u003cbr>なお、\u003ccode>div\u003c/code> の \u003ccode>display\u003c/code> のように「ブラウザが最初から当てているスタイル」まで戻したいときは \u003ccode>revert\u003c/code> という値も使えます。\u003c/p>\u003c/div>","lecture":"responsive-reset","links":[["MDN: revert","https://developer.mozilla.org/ja/docs/Web/CSS/revert"],["MDN: カスケードと継承","https://developer.mozilla.org/ja/docs/Web/CSS/Cascade"],["kojika17: UAスタイルシートとリセットCSSとは","https://kojika17.com/2023/02/inital-value-and-UA-of-style-sheet.html"]],"spots":[{"file":"css","start":196,"end":205,"note":"スライドメニューの解除","ref":false},{"file":"css","start":223,"end":225,"note":"区切り線を消す","ref":false},{"file":"css","start":461,"end":465,"note":"全幅表示の解除","ref":false}]},{"id":"a-block","cat":"CSS","title":"リンクを block にして押しやすくする","body":"\u003cp>\u003ccode>&lt;a&gt;\u003c/code> はインライン要素なので、そのままでは\u003cstrong>文字の部分しかクリックできません\u003c/strong>。\u003c/p>\n\u003cp>\u003ccode>display: block\u003c/code> にすると、リンクが行の幅いっぱいに広がり、\u003ccode>padding\u003c/code> の上下も含めてクリックできるようになります。スマホでは指でタップするので、押せる範囲を広くとることが大切です。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>余白を \u003ccode>li\u003c/code> ではなく \u003cstrong>\u003ccode>a\u003c/code> の padding\u003c/strong> でつけているのがポイントです。\u003ccode>li\u003c/code> に余白をつけると、その部分は押しても反応しません。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: display","https://developer.mozilla.org/ja/docs/Web/CSS/display"]],"spots":[{"file":"css","start":228,"end":231,"note":"","ref":false}]},{"id":"sp-only","cat":"CSS","title":"スマホのときだけ改行する（.sp-only）","body":"\u003cp>キャッチコピーは、スマホでは3行に分けて、PCでは1行で表示しています。\u003c/p>\n\u003cp>HTMLの \u003ccode>&lt;br&gt;\u003c/code> に \u003ccode>sp-only\u003c/code> というクラスをつけ、PC幅（769px以上）のときは \u003ccode>display: none\u003c/code> で\u003cstrong>改行そのものを消して\u003c/strong>います。\u003c/p>\n\u003cp>このように「特定の画面幅のときだけ表示する」ための汎用クラスを用意しておくと、ほかの場所でも使い回せます。\u003c/p>","lecture":"","links":[["MDN: \u003cbr>","https://developer.mozilla.org/ja/docs/Web/HTML/Element/br"]],"spots":[{"file":"html","start":51,"end":51,"note":"クラスをつけた br","ref":false},{"file":"css","start":243,"end":248,"note":"PCでは非表示","ref":false}]},{"id":"section-common","cat":"CSS","title":"共通クラスと個別クラスの組み合わせ","body":"\u003cp>HTMLの \u003ccode>class=\"section section-pick-up\"\u003c/code> のように、1つの要素に\u003cstrong>2つのクラス\u003c/strong>をつけています。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>.section\u003c/code> … すべてのセクションに共通のスタイル（上下の余白）\u003c/li>\n\u003cli>\u003ccode>.section-pick-up\u003c/code> … そのセクションだけのスタイル（背景色、下の余白を少し広く）\u003c/li>\n\u003c/ul>\n\u003cp>共通の余白を1か所で管理できるので、「セクションの余白を全部変えたい」ときに \u003ccode>.section\u003c/code> だけ直せば済みます。見出しの \u003ccode>.section-title\u003c/code>、幅を制限する \u003ccode>.section-inner\u003c/code> も同じ考え方の共通パーツです。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>.section-pick-up\u003c/code> の \u003ccode>padding-bottom\u003c/code> が \u003ccode>.section\u003c/code> の \u003ccode>padding\u003c/code> を上書きできるのは、CSSファイルの中で\u003cstrong>後ろに書かれている\u003c/strong>からです（詳細度が同じなら後勝ち）。\u003c/p>\u003c/div>","lecture":"","links":[["MDN: クラスセレクター","https://developer.mozilla.org/ja/docs/Web/CSS/Class_selectors"]],"spots":[{"file":"html","start":48,"end":48,"note":"クラスを2つ指定","ref":false},{"file":"css","start":250,"end":259,"note":"共通：上下の余白","ref":false},{"file":"css","start":312,"end":319,"note":"個別：背景色と下余白の上書き","ref":false},{"file":"css","start":481,"end":492,"note":"個別：背景色と見出しの色","ref":false}]},{"id":"calc-font-size","cat":"CSS","title":"px を rem に変換する calc()","body":"\u003cp>デザインカンプの文字サイズ（px）を、\u003ccode>rem\u003c/code> に変換して指定しています。\u003c/p>\n\u003cpre data-lang=\"css\">font-size: calc(26 / 16 * 1rem);  /* 26px ÷ 16 ＝ 1.625rem */\u003c/pre>\n\u003cp>\u003ccode>1rem\u003c/code> はブラウザの基準の文字サイズ（ふつう16px）です。\u003ccode>rem\u003c/code> で指定しておくと、ユーザーがブラウザの文字サイズ設定を大きくしたとき、それに合わせて文字も大きくなります（px だと変わりません）。\u003c/p>\n\u003cp>電卓で計算して \u003ccode>1.625rem\u003c/code> と書いてもよいのですが、\u003ccode>calc(デザインのpx値 / 16 * 1rem)\u003c/code> と書けば\u003cstrong>「元のデザインは26pxだった」とコードから読み取れる\u003c/strong>ので、あとから修正しやすくなります。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>html { font-size: 62.5%; }\u003c/code> として計算を楽にする方法もありますが、ユーザーの設定や外部ライブラリと相性が悪いことがあるため、ここでは使っていません。\u003c/p>\u003c/div>","lecture":"calc-font-size","links":[["MDN: calc()","https://developer.mozilla.org/ja/docs/Web/CSS/calc"],["MDN: CSS の値と単位","https://developer.mozilla.org/ja/docs/Learn/CSS/Building_blocks/Values_and_units"]],"spots":[{"file":"css","start":262,"end":263,"note":"見出し 26px","ref":false},{"file":"css","start":270,"end":270,"note":"見出し PC 28px","ref":false},{"file":"css","start":399,"end":400,"note":"ボタン 18px","ref":false},{"file":"css","start":636,"end":636,"note":"コピーライト 12px","ref":false}]},{"id":"center-inner","cat":"CSS","title":"コンテンツ幅を制限して中央に置く（inner）","body":"\u003cp>大きなモニターで見たとき、文章や画像が画面の端から端まで広がると読みにくくなります。そこで「inner」という箱で\u003cstrong>最大幅を制限\u003c/strong>しています。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>width: 100%\u003c/code> … 基本は親の幅いっぱい\u003c/li>\n\u003cli>\u003ccode>max-width: 1160px\u003c/code> … ただし1160pxより大きくはならない\u003c/li>\n\u003cli>\u003ccode>margin: 0 auto\u003c/code> … 左右の余白を自動で均等に ＝ \u003cstrong>中央に寄る\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch3>なぜ section と inner の2重構造？\u003c/h3>\n\u003cp>外側の \u003ccode>section\u003c/code> は画面の幅いっぱいに広がって\u003cstrong>背景色\u003c/strong>を担当し、内側の \u003ccode>.section-inner\u003c/code> が\u003cstrong>中身の幅\u003c/strong>を担当します。こうすると「背景は画面いっぱい、中身は中央に収まる」デザインが作れます。\u003c/p>","lecture":"","links":[["MDN: max-width","https://developer.mozilla.org/ja/docs/Web/CSS/max-width"]],"spots":[{"file":"css","start":274,"end":282,"note":"","ref":false},{"file":"css","start":567,"end":571,"note":"フッターも同じ考え方","ref":false},{"file":"html","start":49,"end":49,"note":"section の中に inner","ref":false}]},{"id":"grid-auto-fit","cat":"CSS","title":"メディアクエリなしで列数が変わるグリッド","body":"\u003cp>Pick Up のカードは、画面幅に応じて 3列 → 2列 → 1列 と自動で変わります。\u003cstrong>メディアクエリは使っていません\u003c/strong>。この1行がその仕組みです。\u003c/p>\n\u003cpre data-lang=\"css\">grid-template-columns: repeat(auto-fit, minmax(min(100%, 228px), 1fr));\u003c/pre>\n\u003cdiv class=\"demo\">\n\u003cp class=\"demo-cap\">▼ 枠の右下をドラッグして幅を変えてみましょう\u003c/p>\n\u003cdiv class=\"demo-resize\">\u003cdiv class=\"demo-grid\">\u003cdiv>Card 1\u003c/div>\u003cdiv>Card 2\u003c/div>\u003cdiv>Card 3\u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cp>内側から順に読み解きます。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>min(100%, 228px)\u003c/code> … 2つのうち\u003cstrong>小さいほう\u003c/strong>。ふつうは228px。極端に狭い画面では100%になり、はみ出しを防ぎます\u003c/li>\n\u003cli>\u003ccode>minmax(最小, 1fr)\u003c/code> … 列の幅は「最低228px、余裕があれば均等に広がる」\u003c/li>\n\u003cli>\u003ccode>repeat(auto-fit, …)\u003c/code> … その列を\u003cstrong>入るだけ並べる\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>つまり「1列あたり228pxを確保できなくなったら、列を減らす」という動きになります。減った分は \u003ccode>1fr\u003c/code> で均等に広がるので、すき間はできません。\u003c/p>\n\u003cp>\u003ccode>gap: 30px 20px\u003c/code> は「行の間30px、列の間20px」です。\u003c/p>","lecture":"grid-auto-fit","links":[["MDN: grid-template-columns","https://developer.mozilla.org/ja/docs/Web/CSS/grid-template-columns"],["MDN: minmax()","https://developer.mozilla.org/ja/docs/Web/CSS/minmax"],["MDN: repeat()","https://developer.mozilla.org/ja/docs/Web/CSS/repeat"],["ASCII.jp: auto-fillとauto-fitの使い分け","https://ascii.jp/elem/000/001/659/1659899/"]],"spots":[{"file":"css","start":321,"end":342,"note":"","ref":false},{"file":"html","start":64,"end":65,"note":"グリッドの親と子","ref":true}]},{"id":"flex-column-reverse","cat":"CSS","title":"見た目の順番だけ逆にする（column-reverse）","body":"\u003cp>カードの見た目は「\u003cstrong>画像が上、テキストが下\u003c/strong>」ですが、HTMLは「\u003cstrong>テキスト → 画像\u003c/strong>」の順で書かれています。左のHTMLで確認してみましょう。\u003c/p>\n\u003cp>これは、スクリーンリーダーなどが画像より先に「何の商品か（見出し）」を読み上げられるようにするためです。\u003c/p>\n\u003cp>CSSの \u003ccode>flex-direction: column-reverse\u003c/code> は「縦に並べる、ただし\u003cstrong>下から上へ\u003c/strong>」という指定。これでHTMLの順番を変えずに、見た目だけを逆にしています。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>justify-content: flex-end\u003c/code> が必要な理由：\u003ccode>column-reverse\u003c/code> では並べ始める位置が「下」になります。カードの高さがそろえられて余白ができたとき、そのままだと中身が下に寄ってしまうので、\u003ccode>flex-end\u003c/code>（＝逆向きなので上側）に寄せています。\u003c/p>\u003c/div>","lecture":"flex-column-reverse","links":[["MDN: flex-direction","https://developer.mozilla.org/ja/docs/Web/CSS/flex-direction"]],"spots":[{"file":"css","start":345,"end":353,"note":"","ref":false},{"file":"html","start":65,"end":77,"note":"HTMLは テキスト → 画像 の順","ref":false}]},{"id":"overflow-radius","cat":"CSS","title":"角丸からはみ出す画像を切り取る","body":"\u003cp>カードに \u003ccode>border-radius: 8px\u003c/code> で角丸をつけても、\u003cstrong>中の画像は四角いまま\u003c/strong>なので、角からはみ出して見えてしまいます。\u003c/p>\n\u003cp>親に \u003ccode>overflow: hidden\u003c/code> を指定すると、親の形（角丸）からはみ出た部分が切り取られ、画像の角もきれいに丸くなります。\u003c/p>","lecture":"","links":[["MDN: border-radius","https://developer.mozilla.org/ja/docs/Web/CSS/border-radius"],["MDN: overflow","https://developer.mozilla.org/ja/docs/Web/CSS/overflow"]],"spots":[{"file":"css","start":355,"end":358,"note":"","ref":false}]},{"id":"pseudo-elements","cat":"CSS","title":"疑似要素 ::after で装飾を足す","body":"\u003cp>「詳細はこちら」ボタンの矢印は、HTMLには書かれていません。CSSの\u003cstrong>疑似要素 \u003ccode>::after\u003c/code>\u003c/strong> が、ボタンの中身の最後に「見えない要素」を1つ追加し、そこに矢印の画像を表示しています。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>content: \"\"\u003c/code> … \u003cstrong>必須\u003c/strong>。これがないと疑似要素は表示されません（中身は空でOK）\u003c/li>\n\u003cli>\u003ccode>display: inline-block\u003c/code> … 幅と高さを指定できるようにする\u003c/li>\n\u003cli>\u003ccode>background-image\u003c/code> … 矢印のSVGを背景として表示\u003c/li>\n\u003cli>\u003ccode>background-size: contain\u003c/code> … 縦横比を保ったまま、箱に収まるように表示\u003c/li>\n\u003cli>\u003ccode>background-repeat: no-repeat\u003c/code> … 画像を繰り返さない\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>メリット\u003c/strong>：矢印や下線のような「意味を持たない飾り」をHTMLに書かずに済みます。ボタンが3つあっても、CSSは1か所だけです。\u003c/p>\n\u003cdiv class=\"note\">\u003cp>\u003ccode>url('../images/…')\u003c/code> のパスは、\u003cstrong>CSSファイルの場所\u003c/strong>が基準です。\u003ccode>css\u003c/code> フォルダから1つ上に戻って \u003ccode>images\u003c/code> フォルダへ、という意味になります。\u003c/p>\u003c/div>","lecture":"pseudo-elements","links":[["MDN: ::after","https://developer.mozilla.org/ja/docs/Web/CSS/::after"],["MDN: ::before","https://developer.mozilla.org/ja/docs/Web/CSS/::before"]],"spots":[{"file":"css","start":411,"end":424,"note":"ボタンの矢印","ref":false},{"file":"html","start":72,"end":72,"note":"HTMLに矢印は書かれていない","ref":false},{"file":"css","start":597,"end":617,"note":"フッターの下線","ref":false}]},{"id":"fit-content","cat":"CSS","title":"width: fit-content（中身の幅に合わせる）","body":"\u003cp>住所と営業時間のブロックは「\u003cstrong>左ぞろえの文章を、かたまりごと中央に置く\u003c/strong>」デザインです。\u003ccode>text-align: center\u003c/code> では各行が中央ぞろえになってしまうので、別の方法を使います。\u003c/p>\n\u003col>\n\u003cli>\u003ccode>width: fit-content\u003c/code> で、ブロックの幅を\u003cstrong>中身の幅ぴったり\u003c/strong>に縮める\u003c/li>\n\u003cli>\u003ccode>margin: 30px auto 0\u003c/code> の \u003ccode>auto\u003c/code> で、左右の余白を均等にして中央へ\u003c/li>\n\u003c/ol>\n\u003cp>ブロック要素はふつう親の幅いっぱいに広がるので、そのままでは \u003ccode>margin: auto\u003c/code> で中央に寄せられません。\u003ccode>fit-content\u003c/code> で幅を縮めるのがポイントです。\u003c/p>\n\u003cp>News の日付ラベルでも、背景色の幅を文字に合わせるために使っています。\u003c/p>","lecture":"fit-content","links":[["MDN: fit-content","https://developer.mozilla.org/ja/docs/Web/CSS/fit-content"]],"spots":[{"file":"css","start":439,"end":446,"note":"","ref":false},{"file":"html","start":111,"end":114,"note":"住所と営業時間","ref":false},{"file":"css","start":518,"end":519,"note":"日付ラベル","ref":false}]},{"id":"full-width","cat":"CSS","title":"親の余白を無視して画面幅いっぱいに広げる","body":"\u003cp>スマホでは、地図だけが画面の端から端まで広がっています。親の \u003ccode>.section\u003c/code> には左右20pxの余白があるのに、それを突き抜けています。\u003c/p>\n\u003cpre data-lang=\"css\">width: 100vw;\nmargin: 20px calc(50% - 50vw) 0;\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>100vw\u003c/code> … 画面（ビューポート）の幅そのもの\u003c/li>\n\u003cli>\u003ccode>calc(50% - 50vw)\u003c/code> … 「親の幅の半分 − 画面の幅の半分」。画面のほうが広いので\u003cstrong>マイナスの値\u003c/strong>になります\u003c/li>\n\u003c/ul>\n\u003cp>左右にマイナスのマージン（ネガティブマージン）を指定すると、要素が外側へはみ出します。たとえば画面幅375pxなら、親の幅は335px。\u003ccode>167.5px − 187.5px ＝ −20px\u003c/code> となり、ちょうど親の余白20px分だけ外へ広がります。余白の値を直接書いていないので、\u003cstrong>余白が変わっても自動で対応\u003c/strong>できます。\u003c/p>\n\u003cp>\u003ccode>iframe\u003c/code>（Googleマップ）は \u003ccode>width: 100%\u003c/code> でその箱いっぱいに広げ、高さはCSSで指定しています。PCでは全幅表示をやめて、通常の幅に戻します。\u003c/p>","lecture":"full-width","links":[["MDN: vw などの長さの単位","https://developer.mozilla.org/ja/docs/Web/CSS/length"],["はにわまん: 子要素を親要素からはみ出して画面いっぱいにするCSS","https://haniwaman.com/inner-over/"]],"spots":[{"file":"css","start":452,"end":459,"note":"","ref":false},{"file":"css","start":467,"end":474,"note":"地図のサイズ","ref":false},{"file":"html","start":115,"end":120,"note":"Googleマップの埋め込み","ref":false}]},{"id":"grid-placement","cat":"CSS","title":"Grid で置き場所を指定する（News）","body":"\u003cp>News の記事は、HTMLの順番（日付 → タイトル → 本文）を変えずに、PCのときだけ次のレイアウトにしています。\u003c/p>\n\u003cpre data-lang=\"css\">┌────────┬──────────────────┐\n│ 日付   │ タイトル         │ ← 1行目\n├────────┴──────────────────┤\n│ 本文                      │ ← 2行目\n└───────────────────────────┘\u003c/pre>\n\u003ch3>親：列を定義する\u003c/h3>\n\u003cp>\u003ccode>grid-template-columns: auto 1fr\u003c/code> … 1列目は中身（日付）の幅、2列目は残り全部。\u003c/p>\n\u003ch3>子：どのマスに置くか指定する\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>grid-row\u003c/code> … 何行目か\u003c/li>\n\u003cli>\u003ccode>grid-column\u003c/code> … 何列目か\u003c/li>\n\u003cli>\u003ccode>grid-column: 1 / -1\u003c/code> … 「1本目の線から最後の線まで」＝\u003cstrong>全部の列にまたがる\u003c/strong>（\
